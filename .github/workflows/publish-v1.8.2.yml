name: Publish AudioCal Hear v1.8.2 threshold fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.8.2.yml"
      - "RELEASE_NOTES_v1.8.2.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Validate standalone v1.8.2
        run: |
          set -euo pipefail
          grep -q 'AudioCal Hear v1.8.2' index.html
          grep -q 'function boundaryConfirmed' index.html
          grep -q "case 'retryrecord'" index.html
          test -s RELEASE_NOTES_v1.8.2.md
          cp index.html AudioCal_Hear_v1.8.2.html
      - name: Publish bilingual public pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.8.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.8.2 \
              --repo "$GITHUB_REPOSITORY" \
              --title "AudioCal Hear v1.8.2 — Reliable Hearing Thresholds (Public Preview)" \
              --notes-file RELEASE_NOTES_v1.8.2.md --prerelease
          else
            gh release create v1.8.2 AudioCal_Hear_v1.8.2.html \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AudioCal Hear v1.8.2 — Reliable Hearing Thresholds (Public Preview)" \
              --notes-file RELEASE_NOTES_v1.8.2.md \
              --prerelease
          fi
