name: Source and regression tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/source-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/source-tests.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated standalone HTML and run behavioral unit tests
        run: npm run verify
