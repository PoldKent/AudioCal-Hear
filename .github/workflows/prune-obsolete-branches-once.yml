name: One-time guarded removal of obsolete Hear branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-obsolete-branches-once.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'PoldKent/AudioCal-Hear'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify all branch refs and absence of open PRs before deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$repo" --jq '.default_branch')" = "main"
          open_pr_heads="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          if [ -n "$open_pr_heads" ]; then
            echo "::error::Open PRs exist; refusing to prune any branches"
            exit 1
          fi
          count=0
          while read -r branch expected; do
            test -n "$branch" || continue
            test "$branch" != "main"
            current="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$current" != "$expected" ]; then
              echo "::error::Ref changed: $branch ($current instead of $expected)"
              exit 1
            fi
            count=$((count + 1))
          done <<'BRANCH_LIST'
          audit/functional-truth-20261031 ff7515b00f46a983ff357a5df434f0b88e2aac6f
          feat/device-aware-digital-tone-range 2ba8169c12128272f48b5254b408f509ff13a23a
          feat/eq-three-db-per-step 3e0564298ad026007d26545f985b6c39e0a933bc
          feat/hear-actionable-eq-guide-20261101 ed5bed9c3b78711caee7756305956da3193bae94
          feat/hear-frequency-sweep-precheck 86f803993a94fbd6d7a3c3b3fa0b97be11e12113
          feat/hear-main-consolidation b4bf1c5d68be98868134a532e65dbc8c9e007d1a
          feat/hear-streamlined-calibration-20261101 cd5168627a52e74f025929b3fc10af27880e2858
          feat/hear-sweep-slow-extremes e29bf585dc6158e11c355660652a2789624257c3
          feat/hear-v2-inline-loudness 9752d1db03c5ec147cb306bf8f3455b027383346
          feat/hear-v2-personal-sound-pipeline 285f094ba12192895734b8da2754e29572dae008
          feat/hear-v2-user-first-20261101 f50c3e091b2e2be9d636dfe6fc3554ae3e2347b8
          feat/horizontal-eq-png-card f0d7130b4fb4dc424f36bdc8e09e1a3cdc62384f
          feature/calibration-context-trace-20261031 6faccc36209b593fc2e50efeb4e3b6d7925300c0
          feature/conservative-eq-interpretation-v2 3b07bc306e7ca0466fa5dee408417a79c4a0309a
          feature/evidence-audit-independent-validation 98bf777306e2a944bb86dfcb2fee31221a847096
          feature/suprathreshold-loudness-evidence ffd57a53ae75f880e0a9ed3e5a204b5e2b43e031
          fix/af02-single-source-eq-result-sync 11b92c6e0c8e290350e742531116f9c15fcc402f
          fix/context-eq-control-conversion 6fc626970a2660b0f4fdd7a19881f904cebfc913
          fix/eq-physical-steps-vs-db-20261101 8e816e9cb9466c3e9573886be68ee43dd6cfa767
          fix/frequency-test-range-and-coverage 62ee7b422ab53baed879988a6c48901ae1a2ac70
          fix/hear-post-test-personalization f4e4060ca0545552eed9cbc6a584b760878fa966
          fix/hear-unified-eq-v111 7d976b18ac9ef29003858503db2eb5a8c323d1f5
          fix/hear-visible-full-scale-level-20261101 4ebe145c594d95a722756abe662792c4ce9a94a5
          fix/hearing-test-v21-safe-range 253d5cd12e14d1f78f63d3ed60c90a942a0c736d
          fix/independent-verification-and-historical-trust 8f12db6971679c4de383d20eb7d224748548000c
          fix/reuse-measured-thresholds-eq fdaa061c63db794ae1f6493e37f02273093c4c23
          qa/hear-v2-base-20261101 6a8048347019c21b07649b5852d53aa17fc89d22
          BRANCH_LIST
          test "$count" -eq 27
          echo "Preflight OK: 27 unchanged, non-default branches; zero open PRs"
      - name: Delete exactly the reviewed branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          deleted=0
          while read -r branch expected; do
            test -n "$branch" || continue
            current="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "$expected"
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            echo "Deleted obsolete branch: $branch"
            deleted=$((deleted + 1))
          done <<'BRANCH_LIST'
          audit/functional-truth-20261031 ff7515b00f46a983ff357a5df434f0b88e2aac6f
          feat/device-aware-digital-tone-range 2ba8169c12128272f48b5254b408f509ff13a23a
          feat/eq-three-db-per-step 3e0564298ad026007d26545f985b6c39e0a933bc
          feat/hear-actionable-eq-guide-20261101 ed5bed9c3b78711caee7756305956da3193bae94
          feat/hear-frequency-sweep-precheck 86f803993a94fbd6d7a3c3b3fa0b97be11e12113
          feat/hear-main-consolidation b4bf1c5d68be98868134a532e65dbc8c9e007d1a
          feat/hear-streamlined-calibration-20261101 cd5168627a52e74f025929b3fc10af27880e2858
          feat/hear-sweep-slow-extremes e29bf585dc6158e11c355660652a2789624257c3
          feat/hear-v2-inline-loudness 9752d1db03c5ec147cb306bf8f3455b027383346
          feat/hear-v2-personal-sound-pipeline 285f094ba12192895734b8da2754e29572dae008
          feat/hear-v2-user-first-20261101 f50c3e091b2e2be9d636dfe6fc3554ae3e2347b8
          feat/horizontal-eq-png-card f0d7130b4fb4dc424f36bdc8e09e1a3cdc62384f
          feature/calibration-context-trace-20261031 6faccc36209b593fc2e50efeb4e3b6d7925300c0
          feature/conservative-eq-interpretation-v2 3b07bc306e7ca0466fa5dee408417a79c4a0309a
          feature/evidence-audit-independent-validation 98bf777306e2a944bb86dfcb2fee31221a847096
          feature/suprathreshold-loudness-evidence ffd57a53ae75f880e0a9ed3e5a204b5e2b43e031
          fix/af02-single-source-eq-result-sync 11b92c6e0c8e290350e742531116f9c15fcc402f
          fix/context-eq-control-conversion 6fc626970a2660b0f4fdd7a19881f904cebfc913
          fix/eq-physical-steps-vs-db-20261101 8e816e9cb9466c3e9573886be68ee43dd6cfa767
          fix/frequency-test-range-and-coverage 62ee7b422ab53baed879988a6c48901ae1a2ac70
          fix/hear-post-test-personalization f4e4060ca0545552eed9cbc6a584b760878fa966
          fix/hear-unified-eq-v111 7d976b18ac9ef29003858503db2eb5a8c323d1f5
          fix/hear-visible-full-scale-level-20261101 4ebe145c594d95a722756abe662792c4ce9a94a5
          fix/hearing-test-v21-safe-range 253d5cd12e14d1f78f63d3ed60c90a942a0c736d
          fix/independent-verification-and-historical-trust 8f12db6971679c4de383d20eb7d224748548000c
          fix/reuse-measured-thresholds-eq fdaa061c63db794ae1f6493e37f02273093c4c23
          qa/hear-v2-base-20261101 6a8048347019c21b07649b5852d53aa17fc89d22
          BRANCH_LIST
          test "$deleted" -eq 27
          remaining="$(gh api "repos/$repo/branches?per_page=100" --jq '[.[] | select(.name != "main")] | length')"
          test "$remaining" = "0"
          echo "Verified: only main remains. PR history and commits have not been rewritten."
