name: Browser UI regression (Android, iPhone, desktop)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'tools/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/browser-ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tools/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/browser-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    name: Browser tests / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - android-9x21-chromium
          - iphone-webkit
          - desktop-4x3
          - desktop-21x9
    # Match the pinned test runner with preinstalled Chromium, WebKit and OS
    # dependencies; avoids repeated timeout/cancellation during apt installs.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Confirm container runtime
        run: node --version && npm --version
      - name: Install pinned test runner (not a runtime app dependency)
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1
      - name: Verify generated standalone HTML
        run: npm run check:build
      - name: Run ${{ matrix.project }} browser UI tests
        run: npm run test:browser -- --project="${{ matrix.project }}"
      - name: Upload failure screenshots, traces and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-debug-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
