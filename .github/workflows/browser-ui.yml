name: Browser UI regression (Android, iPhone, desktop)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'tools/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/browser-ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tools/**'
      - 'tests/browser/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/browser-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    # Match the pinned test runner with preinstalled Chromium, WebKit and OS
    # dependencies; avoids repeated timeout/cancellation during apt installs.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Confirm container runtime
        run: node --version && npm --version
      - name: Install pinned test runner (not a runtime app dependency)
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1
      - name: Verify generated standalone HTML
        run: npm run check:build
      - name: Run Android-emulated, iPhone-WebKit, and desktop UI tests
        run: npm run test:browser
      - name: Upload failure screenshots, traces and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
