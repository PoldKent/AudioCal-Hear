name: Publish AudioCal Hear v1.9.0 guided EQ transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.9.0.yml"
      - "RELEASE_NOTES_v1.9.0.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.9 source
        uses: actions/checkout@v4
      - name: Verify generated standalone HTML and test new EQ guidance
        run: |
          set -euo pipefail
          node tools/build.mjs --check
          npm test
          grep -q 'AudioCal Hear v1.9.0' index.html
          grep -q 'function transferMapping' index.html
          grep -q 'id="musicFile"' index.html
          grep -q 'id="transferPanel"' index.html
          test -s RELEASE_NOTES_v1.9.0.md
          cp index.html AudioCal_Hear_v1.9.0.html
      - name: Create or update public pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.9.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.9.0 --repo "$GITHUB_REPOSITORY" \
              --title "AudioCal Hear v1.9.0 — Guided EQ Transfer (Public Preview)" \
              --notes-file RELEASE_NOTES_v1.9.0.md \
              --prerelease
          else
            gh release create v1.9.0 AudioCal_Hear_v1.9.0.html \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AudioCal Hear v1.9.0 — Guided EQ Transfer (Public Preview)" \
              --notes-file RELEASE_NOTES_v1.9.0.md \
              --prerelease
          fi
