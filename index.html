.shell{width:min(800px,100%);margin:auto;padding:0 16px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:41px;height:41px;border-radius:13px;background:linear-gradient(140deg,#0d88c1,#38d6ee);display:grid;place-items:center;box-shadow:0 4px 24px #12cafa31;font-size:23px;color:#05202d}.brand strong{display:block;font-size:17px;letter-spacing:.1px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.8px}.pill{border:1px solid #315a68;background:#0b2638;color:#7fe5eb;border-radius:99px;padding:5px 10px;font-size:11px;white-space:nowrap}.eyebrow{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800;margin:0 0 9px}.hero{padding:20px 4px 17px}.hero h1{font-size:clamp(27px,7vw,43px);line-height:1.13;letter-spacing:-1.2px;margin:0 0 10px}.hero h1 em{font-style:normal;color:var(--yellow)}p{margin:8px 0;color:#b5c8d6}.subtle{font-size:13px;color:var(--muted)}h2{font-size:20px;line-height:1.25;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}label{display:block;color:#c8dce9;font-weight:650;font-size:13px;margin:12px 0 6px}.card{background:linear-gradient(180deg,#112338,#101d2e);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:13px 0;box-shadow:0 10px 30px #0002}.soft{background:#0b1a2b;border:1px solid #244157;border-radius:14px;padding:13px;margin:12px 0}.warning{background:#362817;border-color:#80612d;color:#ffe1ab}.warning p{color:#ffdeab}.warning strong{color:#ffe1ab}.info{border-color:#276577;background:#103442}.field{width:100%;background:#091a2a;border:1px solid #36516a;color:var(--fg);padding:12px 13px;border-radius:12px;min-height:45px;outline:none}.field:focus{border-color:var(--cyan)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.choice{background:#0d1c2c;border:1px solid #365068;color:#d7eafa;padding:11px 13px;border-radius:12px;text-align:left;flex:1 1 145px;min-width:0}.choice.selected{border-color:var(--yellow);background:#3c351e;color:#ffdd83;box-shadow:inset 0 0 0 1px #e9ba4b66}.choice strong,.choice span{display:block}.choice span{font-size:11px;opacity:.81;margin-top:3px}.btn{border:1px solid transparent;border-radius:13px;min-height:47px;padding:12px 15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}.btn-primary{background:linear-gradient(115deg,#ffcb65,#f7b941);color:#24190b}.btn-alt{background:#17384b;border-color:#32758d;color:#d0f4ff}.btn-ghost{background:#0c1b2c;border-color:#355067;color:#cde2f2}.btn-danger{background:#45232b;border-color:#7a414f;color:#ffc1ca}.full{width:100%}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.row.wrap{flex-wrap:wrap}.grow{flex:1}.steps{display:flex;gap:7px;align-items:center;justify-content:space-between;margin:13px 0}.step{flex:1;height:5px;background:#294159;border-radius:9px}.step.on{background:var(--cyan)}.small{font-size:12px}.tiny{font-size:11px}.muted{color:var(--muted)}.hide{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#081525ef;backdrop-filter:blur(15px);border-top:1px solid #244054}.navinner{width:min(800px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:auto}.navbtn{border:none;background:transparent;color:#8ba7b9;border-radius:12px;padding:7px 2px;font-size:11px;font-weight:750;min-height:54px}.navbtn b{display:block;font-size:19px;line-height:1.3;font-weight:500}.navbtn.active{color:var(--yellow);background:#3f341e}.frequency{font-size:clamp(43px,11vw,74px);font-weight:850;line-height:1.1;letter-spacing:-2px;color:#effbff;margin:8px 0}.frequency small{font-size:.38em;font-weight:650;color:var(--cyan);letter-spacing:0}.wavebox{background:radial-gradient(circle,#19475b,#0b1d2d 65%);padding:22px 8px;min-height:141px;border:1px solid #2b5367;border-radius:17px;margin:16px 0;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.wave{height:60px;display:flex;align-items:center;justify-content:center;gap:3px;width:100%;max-width:310px}.wave span{background:linear-gradient(180deg,#a4efff,#22a9e1);width:4px;border-radius:5px;opacity:.95;transition:height .1s ease}.meter{background:#213d52;height:10px;border-radius:14px;overflow:hidden}.meter div{height:100%;background:linear-gradient(90deg,#3ed4ee,#ffcd58);border-radius:14px;width:100%;transition:width .12s linear}.hold-meter{height:8px;background:#243b4c;border-radius:8px;overflow:hidden;margin:6px 0 8px}.hold-meter div{height:100%;width:100%;background:var(--yellow);border-radius:8px}.hold-time{font-variant-numeric:tabular-nums;color:var(--yellow);font-size:20px;font-weight:800}.center{text-align:center}.progress{background:#223d52;border-radius:20px;height:8px;overflow:hidden}.progress div{background:var(--green);height:100%;transition:width .2s ease}.bigbutton{min-height:72px;font-size:17px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border-radius:11px;background:#091b2a;border:1px solid #254458;padding:10px 6px;text-align:center}.stat strong{font-size:19px;display:block;color:var(--yellow)}.stat small{font-size:10px;color:var(--muted)}.equalizer{overflow-x:auto;padding:12px 0 4px;scrollbar-color:#486071 transparent}.eqgrid{display:flex;justify-content:space-between;gap:6px;min-width:max-content;width:100%;align-items:end}.eqband{width:clamp(37px,calc((100vw - 72px)/10),67px);display:flex;flex-direction:column;align-items:center;gap:4px}.eqval{font-size:12px;font-weight:850;color:var(--yellow)}.eqbar{height:124px;width:22px;background:#071522;border:1px solid #324a60;border-radius:7px;position:relative;overflow:hidden}.eqcenter{position:absolute;left:0;right:0;top:50%;height:1px;background:#8097a466}.eqfill{position:absolute;left:5px;right:5px;background:linear-gradient(0deg,#118db9,#6cdcf4);border-radius:3px;min-height:3px}.eqlabel{font-size:10px;color:#a3c0d0;white-space:nowrap}.eqbuttons{display:flex;gap:3px}.eqbuttons button{background:#1d3348;border:1px solid #41596d;border-radius:7px;color:#cceafa;min-width:27px;min-height:29px;font-weight:900}.result-list{display:grid;gap:7px}.result-item{display:grid;grid-template-columns:minmax(75px,1fr) 77px 58px;align-items:center;gap:8px;border:1px solid #284658;background:#0b1a2c;border-radius:11px;padding:9px 10px}.result-item strong{font-size:13px}.result-item small{color:var(--muted);display:block;font-size:10px}.itemcontrols{display:flex;gap:4px}.itemcontrols button{background:#1c3448;border:1px solid #365b70;color:white;border-radius:8px;width:34px;height:35px;font-size:18px;font-weight:750}.value{font-size:16px;color:var(--yellow);font-weight:850;text-align:right;white-space:nowrap}.profile{padding:12px;border:1px solid #345067;background:#0d1d2f;border-radius:13px;margin:10px 0}.profile.current{border-color:var(--yellow)}.profile h3{margin:0;font-size:15px}.profile small{color:var(--muted)}.tag{display:inline-block;padding:3px 7px;background:#234252;border-radius:7px;color:#a8e5fa;font-size:10px;font-weight:700}.inline-options{display:flex;gap:12px;flex-wrap:wrap}.inline-options label{margin:6px 0;display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13px}.inline-options input{accent-color:var(--yellow);width:18px;height:18px}.foot{padding:20px 0 10px;color:#7792a5;font-size:11px}.divider{height:1px;background:#294254;margin:16px 0}.outline-note{border-left:3px solid var(--yellow);padding:5px 0 5px 12px;color:#d9e5ed}.status{min-height:24px;color:var(--green);font-size:12px}.disabled-note{opacity:.7}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}select option{background:#101d2e;color:#fff}
@media(max-width:390px){.shell{padding:0 12px}.card{padding:14px}.grid2{grid-template-columns:1fr}.eqband{width:40px}.choice{padding:11px 9px}.result-item{grid-template-columns:minmax(60px,1fr) 73px 57px;gap:6px;padding:7px}.itemcontrols button{width:32px}}
@media(min-width:650px){.hero{padding:38px 4px 20px}.card{padding:24px}.eqbar{height:160px}.eqband{width:57px}.nav{bottom:12px;left:50%;right:auto;transform:translateX(-50%);border:1px solid #284458;border-radius:18px;width:min(620px,95%);padding:5px}}

<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">◉</div><div><strong>AudioCal <span style="color:var(--cyan)">Hear</span></strong><small>CALIBRACIÓN PERSONAL</small></div></div><span class="pill">● SIN INSTALAR</span></header>
<main id="root" aria-live="polite"></main>
<footer class="foot">AudioCal Hear v1.4 · Procesamiento local y sin envío de datos · Estimaciones perceptivas, no audiometría médica ni medición calibrada del equipo. Nunca uses volumen alto para escuchar un tono que no aparece.</footer>
</div>
<nav class="nav" aria-label="Navegación principal"><div class="navinner">
<button type="button" class="navbtn" data-nav="setup"><b>⚙</b>Configurar</button>
<button type="button" class="navbtn" data-nav="test"><b>◉</b>Prueba</button>
<button type="button" class="navbtn" data-nav="results"><b>▥</b>Ajustes</button>
<button type="button" class="navbtn" data-nav="profiles"><b>▤</b>Perfiles</button>
</div></nav>
<script>
(()=>{'use strict';
const presets={
 car7:{name:'Automóvil · 7 bandas (tus fotos)',short:'Auto 7',bands:[64,160,400,1000,2500,6250,15625],min:-6,max:6,step:1,note:'Las frecuencias coinciden exactamente con tus fotos. El rango ±6 dB es provisional: ajústalo si tu radio admite otros límites.'},
 photo10:{name:'Auriculares · 10 bandas (tu foto)',short:'Auriculares 10',bands:[30,60,120,250,500,1000,2000,4000,8000,16000],min:-20,max:20,step:1,note:'Frecuencias exactas de la primera imagen; escala visible de −20 a +20 dB.'},
 iso10:{name:'ISO · 10 bandas (octavas)',short:'ISO 10',bands:[31.5,63,125,250,500,1000,2000,4000,8000,16000],min:-12,max:12,step:1,note:'Frecuencias preferidas ISO/ANSI para intervalos de una octava.'},
 iso7:{name:'Habitual · 7 bandas',short:'Estándar 7',bands:[63,160,400,1000,2500,6300,16000],min:-12,max:12,step:1,note:'Distribución frecuente de siete bandas; no todos los aparatos de 7 bandas son iguales.'},
 five:{name:'Habitual · 5 bandas',short:'5 bandas',bands:[60,250,1000,4000,16000],min:-12,max:12,step:1,note:'Configuración común de cinco bandas. Comprueba las etiquetas de tu equipo.'},
 iso15:{name:'ISO · 15 bandas',short:'ISO 15',bands:[25,40,63,100,160,250,400,630,1000,1600,2500,4000,6300,10000,16000],min:-12,max:12,step:1,note:'15 bandas en tercios aproximados de octava alternos.'},
 iso31:{name:'ISO · 31 bandas (tercio de octava)',short:'ISO 31',bands:[20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000],min:-12,max:12,step:1,note:'31 bandas profesionales en tercios de octava. El examen completo es más largo.'},
 custom:{name:'Personalizado · frecuencias propias',short:'Personalizado',bands:[63,160,400,1000,2500,6300,16000],min:-12,max:12,step:1,note:'Escribe las frecuencias que aparecen en tu ecualizador.'}
};
const el=document.getElementById('root');const STORAGE='audiocal-hear-profiles-v1';const STATEKEY='audiocal-hear-active-v1';
const $=s=>document.querySelector(s);const fmt=f=>f>=1000?(Number((f/1000).toFixed(3))+' kHz'):(f+' Hz');
const short=f=>f>=1000?Number((f/1000).toFixed(3))+'k':String(f);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const roundTo=(x,s)=>Math.round(x/s)*s;
const median=a=>{const b=a.slice().sort((x,y)=>x-y);return b.length?b.length%2?b[(b.length-1)/2]:(b[b.length/2-1]+b[b.length/2])/2:null};
function readProfiles(){try{let v=JSON.parse(localStorage.getItem(STORAGE));return Array.isArray(v)?v.filter(p=>p&&p.id&&Array.isArray(p.bands)):[]}catch(e){return[]}}
let profiles=readProfiles(),currentId='';try{currentId=localStorage.getItem(STATEKEY)||''}catch(e){};
let current=profiles.find(p=>p.id===currentId)||null;
const TEST_START_DB=-28, TEST_END_DB=-68, SECONDS_PER_DB=3;
// Adaptive sweep: 6 dB for discovery, then 1 dB close to the threshold.
// A first attempt uses at most 8+6 plateaus = 42 s. An optional targeted
// verification uses at most 5 plateaus = 15 s. Total <=57 s per band/ear.
const COARSE_STEP=6, MAX_FIRST=42, MAX_VERIFY=15, MAX_FREQUENCY=60, TEST_DURATION=60;
function stageLevels(stage,coarseDb,firstDb){
 if(stage==='coarse')return [-28,-34,-40,-46,-52,-58,-64,-68];
 if(stage==='fine'){
  const from=Math.min(TEST_START_DB,coarseDb+COARSE_STEP);
  return Array.from({length:Math.max(1,from-coarseDb)},(_,i)=>from-1-i).filter(v=>v>=TEST_END_DB);
 }
 if(stage==='verify'){
  const start=clamp(firstDb+2,TEST_END_DB,TEST_START_DB);
  return Array.from({length:5},(_,i)=>start-i).filter(v=>v>=TEST_END_DB);
 }
 return [];
}
let page='setup',audioCtx=null,tone=null,frame=null,playerAudio=null,playerSource=null,filters=[],playerPreamp=null,playerOutput=null,playerUrl=null,eqBypass=false,selectedSetup='car7',showCustom=false,testStep=0,awaitNext=false,floorReached=false,notice='',sampleNote='',trialElapsed=0;
let preferenceStage=0,preferencePreview=null,preferenceListened=new Set();
const preferenceRounds=[{zone:'bass',title:'Graves y cuerpo',desc:'Bajos, batería y profundidad'},{zone:'voices',title:'Voces y claridad',desc:'Voces e instrumentos en primer plano'},{zone:'air',title:'Detalle y brillo',desc:'Platillos y matices agudos'}];
const cleanTaste=p=>({bass:clamp(Number(p?.taste?.bass)||0,-3,3),voices:clamp(Number(p?.taste?.voices)||0,-3,3),air:clamp(Number(p?.taste?.air)||0,-3,3)});
function tasteGain(f,t){const band=(center,width)=>Math.exp(-0.5*(Math.log2(f/center)/width)**2);return t.bass*band(105,1.35)+t.voices*band(2400,1.05)+t.air*band(7300,1.05)}
let temp={name:'',type:'car',preset:'car7',channels:'both',passes:1,bands:presets.car7.bands.slice(),min:-6,max:6,step:1};
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(profiles));localStorage.setItem(STATEKEY,current?.id||'')}catch(e){notice='No se pudo guardar localmente. Puedes exportar tus valores.'}};
const touch=()=>{if(!current)return;current.updatedAt=Date.now();save()};
const nav=p=>{if(tone)stopTone();floorReached=false;if(page==='results'&&playerAudio&&p!=='results')playerAudio.pause();page=p;render();window.scrollTo({top:0,behavior:'instant'})};
const button=(text,action,cls='btn-ghost',extra='')=>`<button type="button" data-act="${action}" class="btn ${cls}" ${extra}>${text}</button>`;
function setPreset(id){selectedSetup=id;temp.preset=id;temp.bands=(presets[id]||presets.custom).bands.slice();temp.min=presets[id].min;temp.max=presets[id].max;temp.step=presets[id].step;showCustom=id==='custom';render()}
function render(){if(page==='results'&&playerAudio&&playerAudio!==$('#audioPlayer')){try{playerAudio.pause()}catch(e){}}document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===page);b.setAttribute('aria-current',b.dataset.nav===page?'page':'false')});
 el.innerHTML=page==='setup'?renderSetup():page==='test'?renderTest():page==='results'?renderResults():renderProfiles();
 if(page==='test'&&tone?.mode==='test')startVisualizer();if(page==='results'&&current){const newPlayer=$('#audioPlayer');if(playerAudio!==newPlayer){try{playerAudio?.pause()}catch(e){}try{playerSource?.disconnect()}catch(e){}filters.forEach(f=>{try{f.disconnect()}catch(e){}});playerSource=null;filters=[];playerAudio=newPlayer;if(playerUrl)playerAudio.src=playerUrl}updatePlayerFilters()}
}
function renderSetup(){const p=current;return `<section class="hero"><p class="eyebrow">TU SONIDO, A TU MEDIDA</p><h1>Escucha. Detén.<br><em>Calibra.</em></h1><p>Como una prueba de sensibilidad auditiva: un pitido disminuye de volumen, marcas cuándo deja de escucharse y obtienes una propuesta para el ecualizador de tu dispositivo.</p></section>
${p?`<div class="soft info"><strong>Perfil activo: ${esc(p.name)}</strong><p class="small">${esc(presets[p.preset]?.short||'Personalizado')} · ${doneCount(p)}/${plan(p).length} muestras registradas</p><div class="row wrap">${button('Continuar perfil','resume','btn-alt')}${button('Ver ajustes','results','btn-ghost')}</div></div>`:''}
<div class="card"><h2>1. ¿Qué estás calibrando?</h2><label for="deviceName">Nombre del equipo / entorno</label><input class="field" id="deviceName" maxlength="70" placeholder="Ej.: Mi auto, Soundcore, parlantes de sala" value="${esc(temp.name)}">
<label for="deviceType">Tipo de dispositivo</label><select class="field" id="deviceType"><option value="car" ${temp.type==='car'?'selected':''}>Automóvil / radio Bluetooth</option><option value="headphones" ${temp.type==='headphones'?'selected':''}>Audífonos / auriculares</option><option value="speaker" ${temp.type==='speaker'?'selected':''}>Parlantes / altavoz</option></select>
<label>Ecualizador de destino</label><div class="grid2"><button type="button" data-preset="car7" class="choice ${temp.preset==='car7'?'selected':''}"><strong>🚗 Auto · 7 bandas</strong><span>64 · 160 · 400 · 1K · 2.5K · 6.25K · 15.625K</span></button><button type="button" data-preset="photo10" class="choice ${temp.preset==='photo10'?'selected':''}"><strong>🎧 Auriculares · 10 bandas</strong><span>30 · 60 · 120 · 250 · 500 · 1K · 2K · 4K · 8K · 16K</span></button></div>
<label for="extraPreset">Otros ecualizadores frecuentes</label><select id="extraPreset" class="field"><option value="">Escoge otra opción…</option>${['iso7','iso10','five','iso15','iso31','custom'].map(id=>`<option value="${id}" ${temp.preset===id?'selected':''}>${esc(presets[id].name)}</option>`).join('')}</select>
<div class="soft"><div class="small muted">Frecuencias elegidas</div><strong id="freqSummary">${esc(temp.bands.map(short).join(' · '))}</strong><p class="tiny">${esc(presets[temp.preset]?.note||'')}</p></div>
<div id="customSettings" class="${showCustom?'':'hide'}"><label for="customFreqs">Frecuencias (Hz), separadas por coma</label><input id="customFreqs" class="field" value="${esc(temp.bands.join(', '))}" placeholder="63, 160, 400, 1000, 2500"><p class="tiny muted">Entre 2 y 31 bandas, en orden ascendente, entre 20 y 20.000 Hz.</p></div>
<div class="grid2"><div><label for="eqMin">Ganancia mínima (dB)</label><input class="field" id="eqMin" type="number" min="-30" max="-1" step="1" value="${temp.min}"></div><div><label for="eqMax">Ganancia máxima (dB)</label><input class="field" id="eqMax" type="number" min="1" max="30" step="1" value="${temp.max}"></div></div>
${temp.preset==='car7'?'<div class="small muted" style="margin-top:9px">Solo para este automóvil: el rango ±6 dB es provisional. La foto confirma +6, no el mínimo.</div>':''}</div>
<div class="card"><h2>2. Modalidad de escucha</h2><label>Canales que quieres probar</label><div class="chips"><button type="button" data-channels="both" class="choice ${temp.channels==='both'?'selected':''}"><strong>🔊 Ambos / estéreo</strong><span>Ideal para auto y parlantes</span></button><button type="button" data-channels="separate" class="choice ${temp.channels==='separate'?'selected':''}"><strong>🎧 Izquierdo + derecho</strong><span>Para auriculares estéreo</span></button></div>
<label>Repeticiones por frecuencia</label><div class="chips"><button type="button" data-passes="1" class="choice ${temp.passes===1?'selected':''}"><strong>1 vez · Rápida</strong><span>Hasta 42 s por banda y oído</span></button><button type="button" data-passes="2" class="choice ${temp.passes===2?'selected':''}"><strong>2 veces · Verificación</strong><span>Hasta 57 s por banda y oído</span></button></div></div>

function renderResults(){if(!current)return `<section class="hero"><h1>Todavía no hay ajustes</h1><p>Primero realiza una prueba auditiva.</p>${button('Configurar prueba','setup','btn-primary')}</section>`;const p=current,progress=doneCount(p),total=plan(p).length,r=recommend(p),usable=r.filter(x=>x.db!==null&&!x.derived).length,derived=r.filter(x=>x.derived).length;
 const note=usable<3?'Necesitamos al menos tres frecuencias probadas o inferidas para estimar una curva. Las demás bandas permanecerán neutras.':progress<total?'Resultados provisionales: completa las pruebas para mejorar su consistencia.':'Resultados estimados a partir de tus pruebas.';
 return `<section class="hero"><p class="eyebrow">SMART EQ · AJUSTES SUGERIDOS</p><h1>Tu curva de <em>sonido.</em></h1><p>Perfil <strong>${esc(p.name)}</strong> · ${esc(presets[p.preset]?.short||'Personalizado')}</p></section>
<div class="card"><div class="stat-grid"><div class="stat"><strong>${progress}/${total}</strong><small>MUESTRAS</small></div><div class="stat"><strong>${usable}</strong><small>UMBRALES ÚTILES</small></div><div class="stat"><strong>${r.filter(x=>x.gain!==0).length}</strong><small>AJUSTES ≠ 0</small></div></div><p class="small outline-note">${esc(note)} ${derived?'Hay '+derived+' banda(s) interpolada(s) desde otras frecuencias: son estimaciones, no pruebas directas.':''} El algoritmo identifica diferencias locales de sensibilidad y limita las compensaciones; no intenta igualar niveles absolutos ni deducir una audiometría.</p>${usable<p.bands.length?`<div class="soft warning"><strong>⚠ ${p.bands.length-usable} frecuencias sin umbral confirmado</strong><p class="small">La prueba se completó, pero no se obtuvo un límite fiable en todas las bandas. Esas bandas quedan neutras en la compensación auditiva. No subas el volumen al máximo para intentar recuperarlas.</p>${button('↺ Repetir solo frecuencias sin umbral','retrymissing','btn-alt full')}</div>`:''}<h2 style="margin-top:21px">Ecualizador de ${p.bands.length} bandas</h2>
<div class="equalizer"><div class="eqgrid">${r.map(x=>{const span=Math.max(1,p.max-p.min),center=100*p.max/span,y=100*(p.max-x.gain)/span;return `<div class="eqband" data-eq-band="${x.f}"><span class="eqval">${x.gain>0?'+':''}${x.gain}</span><div class="eqbar"><div class="eqcenter" style="top:${center}%"></div><div class="eqfill" style="top:${Math.min(center,y)}%;height:${Math.max(2,Math.abs(center-y))}%"></div></div><span class="eqlabel">${short(x.f)}</span></div>`}).join('')}</div></div>
<div class="soft"><strong>Valores exactos para introducir</strong><div class="result-list" style="margin-top:10px">${r.map(x=>`<div class="result-item"><div><strong>${fmt(x.f)}</strong><small>${x.db===null?'Sin umbral · solo ajuste manual/preferencia':x.quality==='interpolated'?'Estimado entre frecuencias':x.quality==='good'?'Consistente':x.quality==='mixed'?'Diferencia entre oídos':'Verificar umbral'}</small></div><div class="itemcontrols"><button type="button" data-adjust="${x.f}" data-delta="-1" aria-label="Reducir ${fmt(x.f)}">−</button><button type="button" data-adjust="${x.f}" data-delta="1" aria-label="Aumentar ${fmt(x.f)}">+</button></div><strong class="value" data-eq-value="${x.f}">${x.gain>0?'+':''}${x.gain} <small style="display:inline;color:var(--muted)">dB</small></strong></div>`).join('')}</div>
<p class="tiny muted">Puedes ajustar manualmente con − / +. Los cambios se guardan en este perfil. En el automóvil introdúcelos en el radio; para los auriculares en su ecualizador.</p></div><div class="row wrap">${button('⎘ Copiar valores','copy','btn-alt grow')}${button('↓ Descargar TXT','downloadtxt','btn-ghost grow')}</div><div class="row wrap" style="margin-top:9px">${button('↺ Restablecer ajustes manuales','clearmanual','btn-ghost grow')}${button('Cambiar formato de EQ','format','btn-ghost grow')}</div><p id="copyStatus" class="status" role="status"></p></div>
<div class="card"><h2>🎵 Comparar con tu música (opcional)</h2><p class="small">Elige un archivo de audio del teléfono. Puedes escucharlo con esta curva y sin ella. Se procesa dentro de la página y no se sube a ningún servidor.</p><label for="musicFile">Archivo de música</label><input type="file" accept="audio/*" id="musicFile" class="field" style="font-size:12px"><audio id="audioPlayer" controls preload="metadata" style="width:100%;margin:14px 0" aria-label="Reproductor de comparación"></audio><button type="button" class="btn btn-alt full" id="bypassBtn" data-act="bypass">${eqBypass?'EQ DESACTIVADO · activar':'EQ ACTIVADO · comparar sin EQ'}</button><p class="tiny muted">La comparación intenta conservar un margen de volumen constante, pero no iguala la sonoridad percibida de forma calibrada. El ecualizador solo modifica archivos reproducidos aquí. No puede cambiar directamente el ecualizador del auto, de Soundcore ni de todas las aplicaciones del teléfono.</p></div>
<div class="card"><h2>🎧 Personalizar a tu gusto (opcional)</h2><p class="small">Una prueba de audición no identifica necesariamente qué sonido te gusta. Usa <strong>el mismo fragmento de música</strong> para comparar dos ajustes con diferencias deliberadas pero moderadas, y elige lo más cómodo. Esto no diagnostica tu audición.</p><p class="small">Primero carga una canción abajo y pulsa reproducir. Después escucha A y B, preferiblemente durante algunos segundos cada uno, sin modificar el volumen.</p>
<div id="prefRound">${preferenceMarkup()}</div></div>
<div class="soft warning"><strong>Cómo interpretar estos valores</strong><p class="small">Son ajustes exploratorios y conservadores; el nivel digital de una prueba no mide los decibelios que recibe el oído. No amplifiques tonos ausentes, especialmente en extremos graves/agudos. Si se escucha saturación, reduce ganancia o volumen. Si hiciste pruebas por separado, el EQ compartido combina ambos oídos: no puede corregir cada canal por separado.</p></div>`}
function renderProfiles(){return `<section class="hero"><p class="eyebrow">BIBLIOTECA LOCAL</p><h1>Mis <em>perfiles.</em></h1><p>Guarda una calibración independiente por dispositivo, posición de escucha y volumen. Cambiar de Bluetooth no cambia el perfil automáticamente.</p></section>
${profiles.length?profiles.map(p=>`<div class="profile ${current?.id===p.id?'current':''}"><div class="row" style="justify-content:space-between;align-items:start"><div><h3>${esc(p.name)}</h3><small>${esc(presets[p.preset]?.short||'Personalizado')} · ${new Date(p.createdAt).toLocaleDateString('es')} · ${doneCount(p)}/${plan(p).length} pruebas</small></div>${current?.id===p.id?'<span class="tag">ACTIVO</span>':''}</div><div class="row wrap" style="margin-top:11px"><button type="button" data-load="${esc(p.id)}" class="btn btn-alt grow">Abrir perfil</button><button type="button" data-export="${esc(p.id)}" class="btn btn-ghost">Exportar</button><button type="button" data-delete="${esc(p.id)}" class="btn btn-danger">Borrar</button></div></div>`).join(''):`<div class="card"><h3>Todavía no tienes perfiles</h3><p>Cuando comiences tu primera calibración aparecerá aquí.</p></div>`}
<div class="card"><h2>Respaldo de perfiles</h2><p class="small">Los perfiles se conservan en el almacenamiento del navegador actual, si está disponible. Un cambio de navegador, modo privado o borrado de datos puede eliminarlos.</p><div class="row wrap">${button('↓ Exportar todos (JSON)','exportall','btn-alt grow')}${button('↑ Importar JSON','import','btn-ghost grow')}</div><input id="importInput" class="hide" type="file" accept=".json,application/json"></div>
<div class="card"><h2>Frecuencias disponibles</h2><p class="small">Los ecualizadores de 7 y 10 bandas de tus fotos están precargados exactamente. Otros fabricantes pueden usar frecuencias parecidas pero no iguales.</p>${Object.entries(presets).filter(([id])=>id!=='custom').map(([id,p])=>`<div class="small" style="margin:8px 0"><strong>${esc(p.short)}:</strong> ${esc(p.bands.map(short).join(' · '))}</div>`).join('')}</div>`}
function setActive(p){preferenceStage=0;preferencePreview=null;preferenceListened=new Set();stopTone();if(playerAudio)playerAudio.pause();current=p;currentId=p.id;awaitNext=false;floorReached=false;trialElapsed=0;sampleNote='';save();eqBypass=false;nav(firstMissing(p)<0?'results':'test')}
function exportDownload(name,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
const cleanName=s=>s.replace(/[^a-z0-9-_]/gi,'_').slice(0,48);
function resultText(p){const r=recommend(p);return `AudioCal Hear · ${p.name}\nFrecuencias: ${p.bands.length} bandas\nResultado perceptivo estimado; revisar mediante escucha.\n\n`+r.map(x=>`${fmt(x.f).padEnd(11)} ${x.gain>=0?'+':''}${x.gain} dB${x.db===null?' (sin medición)':''}`).join('\n')+'\n\nNo constituye audiometría ni medición acústica.\n'}
async function copyText(txt){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(txt);return true}}catch(e){}try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
function changeEqFormat(){if(!current)return;const ids=Object.keys(presets);const old=current.preset;const options=ids.map((id,i)=>`${i+1}. ${presets[id].name}`).join('\n');const response=prompt('Elige un número de formato para ESTE perfil. Se conservarán los umbrales medidos y se interpolarán solo las frecuencias cercanas a las medidas.\n'+options,String(ids.indexOf(old)+1));if(response===null)return;const id=ids[Number(response)-1];if(!id){alert('Opción inválida');return}if(id==='custom'){alert('Para crear un formato personalizado usa Configurar → nueva calibración.');return}if(id!==old){current.preset=id;current.bands=presets[id].bands.slice();current.min=presets[id].min;current.max=presets[id].max; // Keep collected measurements; do not falsely mark new bands as measured.
 current.formatFrom=old;touch();render();alert('Formato cambiado. Solo las frecuencias que ya probaste cuentan como medidas. Para una recomendación fiable en las nuevas bandas, completa el examen que aparece en Prueba. No reutilices el perfil con otro dispositivo Bluetooth.')}}
async function setupPlayer(){if(!current||!playerAudio)return;const ctx=await ensureAudio();if(!playerSource)playerSource=ctx.createMediaElementSource(playerAudio);try{playerSource.disconnect()}catch(e){}filters.forEach(f=>{try{f.disconnect()}catch(e){}});filters=[];playerPreamp=ctx.createGain();playerOutput=ctx.createGain();const r=recommend(current);for(const b of r){if(b.f>=ctx.sampleRate/2)continue;const f=ctx.createBiquadFilter();f.type='peaking';f.frequency.value=b.f;let ratio=current.bands.length>1?Math.pow(current.bands[current.bands.length-1]/current.bands[0],1/(current.bands.length-1)):2;f.Q.value=clamp(Math.sqrt(ratio)/(ratio-1),.65,5.5);f.gain.value=eqBypass?0:b.gain;filters.push(f)}
let chain=playerSource;chain.connect(playerPreamp);chain=playerPreamp;filters.forEach(f=>{chain.connect(f);chain=f});chain.connect(playerOutput);playerOutput.connect(ctx.destination);updatePlayerFilters(preferencePreview?previewTaste():null)}
function updatePlayerFilters(preview=null){if(!audioCtx||!current||!filters.length)return;const r=recommend(current),now=audioCtx.currentTime;let gainMax=0;
 const origTaste=cleanTaste(current);filters.forEach((f,i)=>{let gain=r.find(b=>Math.abs(b.f-f.frequency.value)<.01)?.gain||0;if(preview){gain=clamp(gain+tasteGain(f.frequency.value,preview)-tasteGain(f.frequency.value,origTaste),current.min,current.max)}gainMax=Math.max(gainMax,gain);if(eqBypass)gain=0;f.gain.setTargetAtTime(gain,now,.05)});const maxPreviewBoost=Math.max(0,...r.map(x=>Math.min(current.max,x.gain+2)));playerPreamp?.gain.setTargetAtTime(Math.pow(10,(-maxPreviewBoost-1)/20),now,.05)}
function handleResultsEvents(t){if(t.id==='musicFile'){const file=t.files?.[0];if(!file)return;if(playerUrl)URL.revokeObjectURL(playerUrl);playerUrl=URL.createObjectURL(file);const view=$('#audioPlayer');if(playerAudio){try{playerAudio.pause()}catch(e){}}playerAudio=view;playerAudio.src=playerUrl;playerAudio.onplay=async()=>{try{await setupPlayer()}catch(e){playerAudio.pause();alert('No se pudo iniciar la escucha A/B: '+e.message)}};return}}
async function handleClick(e){const btn=e.target.closest('button');if(!btn)return;
if(btn.dataset.nav){nav(btn.dataset.nav);return}
if(btn.dataset.preset){temp.name=$('#deviceName')?.value||temp.name;temp.type=$('#deviceType')?.value||temp.type;temp.min=Number($('#eqMin')?.value)||temp.min;temp.max=Number($('#eqMax')?.value)||temp.max;setPreset(btn.dataset.preset);return}
if(btn.dataset.channels){temp.name=$('#deviceName')?.value||temp.name;temp.type=$('#deviceType')?.value||temp.type;temp.channels=btn.dataset.channels;render();return}
if(btn.dataset.passes){temp.name=$('#deviceName')?.value||temp.name;temp.type=$('#deviceType')?.value||temp.type;temp.passes=Number(btn.dataset.passes);render();return}
if(btn.dataset.adjust&&current){const f=Number(btn.dataset.adjust),r=recommend(current).find(x=>x.f===f);if(!r)return;const delta=Number(btn.dataset.delta),next=clamp(roundTo(r.gain+delta,current.step),current.min,current.max);current.manual[f]=(Number(current.manual[f])||0)+(next-r.gain);touch();refreshResultsUI();return}
if(btn.dataset.prefPreview&&current){
 if(!playerAudio||!playerUrl||playerAudio.paused){const status=$('#prefStatus');if(status)status.textContent='Primero selecciona una canción en el reproductor inferior y pulsa reproducir.';return}
 preferencePreview=btn.dataset.prefPreview;preferenceListened.add(preferencePreview);refreshResultsUI();return;
}
if(btn.dataset.prefChoose&&current){
 if(preferenceStage>=preferenceRounds.length)return;
 if(!playerUrl){const status=$('#prefStatus');if(status)status.textContent='Primero elige un archivo de música y escucha A/B.';return}
 const choice=btn.dataset.prefChoose;const zone=preferenceRounds[preferenceStage].zone;
 if(preferenceListened.size<2){const status=$('#prefStatus');if(status)status.textContent='Escucha A y B mientras se reproduce la misma canción antes de elegir.';return}
 const taste=cleanTaste(current);taste[zone]=clamp(taste[zone]+(choice==='A'?-2:choice==='B'?2:0),-3,3);current.taste=taste;
 preferenceStage++;preferencePreview=null;preferenceListened=new Set();touch();refreshResultsUI();return;
}
if(btn.dataset.load){let p=profiles.find(p=>p.id===btn.dataset.load);if(p)setActive(p);return}
if(btn.dataset.export){let p=profiles.find(p=>p.id===btn.dataset.export);if(p)exportDownload('AudioCal_'+cleanName(p.name)+'.json',JSON.stringify({app:'AudioCal Hear',version:1,profiles:[p]},null,2),'application/json');return}
if(btn.dataset.delete){const p=profiles.find(p=>p.id===btn.dataset.delete);if(p&&confirm('¿Borrar el perfil «'+p.name+'»?')){profiles=profiles.filter(x=>x.id!==p.id);if(current?.id===p.id){current=profiles[0]||null;currentId=current?.id||''}save();render()}return}
const a=btn.dataset.act;if(!a)return;
switch(a){
case 'setup':case 'test':case 'results':case 'profiles':nav(a);break;
case 'create':createProfile();break;
case 'check':await playTone(true);break;
case 'stopaudio':stopTone();floorReached=false;trialElapsed=0;if(playerAudio)playerAudio.pause();render();break;
case 'resume':nav(firstMissing(current)<0?'results':'test');break;
case 'play':await playTone(false);break;
case 'mark':if(tone?.mode==='test'){if(tone.stage==='coarse'){const bracket=getCurrentDb();if(bracket===TEST_START_DB){logMeasure('unheard')}else{trialElapsed+=getElapsed();await playTone(false,'fine',bracket)}}else logMeasure('heard')}break;
case 'unheard':if(tone?.mode==='test'&&current){if(confirm('¿No escuchaste el tono desde el principio de esta etapa? No subas el volumen para perseguirlo.'))logMeasure('unheard')}break;
case 'next':awaitNext=false;floorReached=false;trialElapsed=0;sampleNote='';render();break;
case 'retry':awaitNext=false;floorReached=false;trialElapsed=0;sampleNote='';stopTone();render();break;
case 'resettest':if(current&&confirm('Se borrarán las mediciones de este perfil, pero no los demás perfiles.')){current.measures={};current.manual={};awaitNext=false;floorReached=false;trialElapsed=0;sampleNote='';touch();render()}break;
case 'copy':{let ok=await copyText(resultText(current));$('#copyStatus').textContent=ok?'Valores copiados al portapapeles.':'No se pudo copiar. Usa Descargar TXT.';break}
case 'downloadtxt':exportDownload('AudioCal_'+cleanName(current.name)+'.txt',resultText(current),'text/plain;charset=utf-8');break;
case 'clearmanual':if(current){current.manual={};touch();refreshResultsUI()}break;
case 'restartprefs':preferenceStage=0;preferencePreview=null;preferenceListened=new Set();refreshResultsUI();break;
case 'retrymissing':if(current){const points=gather(current).filter(x=>x.db===null).map(x=>x.f);const sides=current.channels==='separate'?['left','right']:['both'];for(const f of points)for(const side of sides)delete current.measures[key(f,side)];if(points.length){touch();awaitNext=false;trialElapsed=0;nav('test')}else alert('No quedan frecuencias sin umbral.')}break;
case 'format':changeEqFormat();break;
case 'bypass':eqBypass=!eqBypass;updatePlayerFilters(preferencePreview?previewTaste():null);btn.textContent=eqBypass?'EQ DESACTIVADO · activar':'EQ ACTIVADO · comparar sin EQ';break;
case 'exportall':exportDownload('AudioCal_Hear_perfiles.json',JSON.stringify({app:'AudioCal Hear',version:1,profiles},null,2),'application/json');break;
case 'import':$('#importInput')?.click();break;
}}
function handleChange(e){const t=e.target;if(t.id==='extraPreset'&&t.value){temp.name=$('#deviceName')?.value||temp.name;temp.type=$('#deviceType')?.value||temp.type;setPreset(t.value);return}if(t.id==='deviceType')temp.type=t.value;if(t.id==='deviceName')temp.name=t.value;if(t.id==='eqMin')temp.min=Number(t.value);if(t.id==='eqMax')temp.max=Number(t.value);if(t.id==='customFreqs'){const f=parseBands(t.value);if(f){temp.bands=f;$('#freqSummary').textContent=f.map(short).join(' · ')}}if(t.id==='musicFile')handleResultsEvents(t);
if(t.id==='importInput'&&t.files?.length){const file=t.files[0];file.text().then(s=>{let data;try{data=JSON.parse(s)}catch(e){alert('Archivo JSON no válido.');return}if(!Array.isArray(data.profiles)){alert('Formato de perfiles no reconocido.');return}let imported=0;for(const p of data.profiles){if(!p||!Array.isArray(p.bands)||p.bands.length<2||p.bands.length>31||p.bands.some(f=>!Number.isFinite(f)||f<20||f>20000)||!p.measures||typeof p.measures!=='object')continue;const copy={...p,id:'p'+Date.now()+Math.random().toString(36).slice(2,8),name:String(p.name||'Importado').slice(0,70),bands:p.bands.slice(),min:clamp(Number(p.min)||-12,-30,-1),max:clamp(Number(p.max)||12,1,30),step:1,passes:p.passes===2?2:1,channels:p.channels==='separate'?'separate':'both',manual:p.manual&&typeof p.manual==='object'?p.manual:{}};profiles.push(copy);imported++}save();alert('Se importaron '+imported+' perfil(es).');render()}).catch(()=>alert('No se pudo leer el archivo.'))}}
// Ensure user can change tabs without generating sound; pause on backgrounding.
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{const t=e.target;if(t.id==='deviceName')temp.name=t.value;if(t.id==='eqMin'&&Number.isFinite(Number(t.value)))temp.min=Number(t.value);if(t.id==='eqMax'&&Number.isFinite(Number(t.value)))temp.max=Number(t.value);if(t.id==='customFreqs'){const f=parseBands(t.value);if(f){temp.bands=f;if($('#freqSummary'))$('#freqSummary').textContent=f.map(short).join(' · ')}}if(['customFreqs','eqMin','eqMax'].includes(t.id))refreshSetupDuration();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTone();floorReached=false;if(playerAudio)playerAudio.pause();if(page==='test')render()}});window.addEventListener('pagehide',stopTone);
render();
})();
</script>
