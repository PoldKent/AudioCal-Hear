/* v1.6.1: compact phones (9:21) and flexible 4:3–21:9 desktops */
@media (max-width: 640px) {
  .topbar { display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;row-gap:5px;padding-top:12px;padding-bottom:9px; }
  .topbar .brand { grid-column:1;grid-row:1;min-width:0;gap:7px; }
  .topbar .brand > div:last-child { min-width:0; }
  .topbar .logo { width:37px;height:37px;flex:0 0 37px; }
  .topbar .brand strong { font-size:clamp(14px,3.7vw,17px);white-space:nowrap; }
  .topbar .brand small { font-size:9px;letter-spacing:.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .topbar .language-controls { display:contents; }
  .topbar .language-controls select { grid-column:2;grid-row:1;width:auto;max-width:min(36vw,132px);min-width:0; }
  .topbar .language-controls .pill { display:inline-flex;grid-column:1 / -1;grid-row:2;justify-self:start;align-items:center;max-width:100%;margin-left:0;padding:4px 9px;font-size:10px;line-height:1.2; }
}
@media (min-width: 900px) {
  .shell { width:min(94vw,1720px);max-width:none;padding-inline:clamp(14px,1.6vw,30px); }
  .hero h1 { font-size:clamp(38px,3.2vw,54px); }
  .hero { max-width:850px; }
  .navinner { width:min(800px,100%); }
  #root[data-page="test"] { max-width:1080px;margin-inline:auto; }
  #root[data-page="profiles"] { max-width:1220px;margin-inline:auto; }
}
@media (min-width: 1100px) {
  #root[data-page="setup"] { display:grid;grid-template-columns:minmax(270px,.8fr) minmax(0,1.25fr);align-items:start;column-gap:clamp(20px,2.5vw,44px); }
  #root[data-page="setup"] > .hero { grid-column:1;grid-row:1; }
  #root[data-page="setup"] > .inline-hero { grid-column:1;grid-row:2;min-width:0; }
  #root[data-page="setup"] > .card { grid-column:2;grid-row:1 / span 4;min-width:0;margin-top:20px; }
  #root[data-page="setup"] .preset-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  #root[data-page="results"] .results-grid { display:grid;grid-template-columns:minmax(0,1.28fr) minmax(330px,.85fr);column-gap:clamp(16px,2vw,34px);align-items:start; }
  #root[data-page="results"] .results-grid > .card { min-width:0;margin:0; }
  #root[data-page="results"] .results-side { display:flex;flex-direction:column;gap:14px;min-width:0; }
  #root[data-page="results"] .results-side > .card,#root[data-page="results"] .results-side > .unobtrusive { margin:0; }
  #root[data-page="results"] .results-compact .eqgrid { justify-content:space-evenly; }
  #root[data-page="profiles"] { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;align-items:start; }
  #root[data-page="profiles"] > .hero, #root[data-page="profiles"] > .profile-focus, #root[data-page="profiles"] > .profiles-empty, #root[data-page="profiles"] > .setup-title, #root[data-page="profiles"] > .unobtrusive { grid-column:1 / -1; }
  #root[data-page="profiles"] > .profile-row { min-width:0;margin:0; }
}
@media (min-width: 1800px) and (min-aspect-ratio: 16/9) {
  .shell { width:min(90vw,1840px); }
  #root[data-page="setup"] { grid-template-columns:minmax(330px,.8fr) minmax(0,1.3fr); }
  #root[data-page="results"] .results-grid { grid-template-columns:minmax(0,1.2fr) minmax(0,.85fr); }
  #root[data-page="results"] .results-compact .eqband { width:clamp(48px,3.3vw,72px); }
}

.results-grid,.results-side{min-width:0}.results-side>.card{margin:13px 0}.results-side>.unobtrusive{margin:13px 0}

/* AudioCal Hear v1.7 — comfort-based tonal balance */
.balance-card{min-width:0}.balance-panel{min-width:0}.balance-progress{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;margin:12px 0}.balance-result{margin:10px 0;padding:12px}.balance-result strong{font-size:13px}.balance-panel select{min-width:0;width:100%;margin-bottom:10px}.balance-panel .grid2{margin:8px 0}.balance-panel .choice{min-width:0}.balance-panel .row.wrap button{min-width:0}@media(max-width:430px){.balance-card{padding:12px}.balance-panel .choice{padding:12px 8px}.balance-panel .row.wrap{gap:5px}.balance-panel .row.wrap button{flex:1 1 42%;padding:10px 6px;font-size:12px}}

<body>

<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">◉</div><div><strong>AudioCal <span style="color:var(--cyan)">Hear</span></strong><small>CALIBRACIÓN PERSONAL</small></div></div><div class="language-controls"><label class="sr-only-locale" for="uiLanguage">Language / Idioma</label><select id="uiLanguage" aria-label="Language / Idioma" title="Language / Idioma"><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option><option value="pt">Português</option><option value="it">Italiano</option><option value="de">Deutsch</option><option value="zh">中文</option><option value="ja">日本語</option></select><span class="pill">● SIN INSTALAR</span></div></header>
<main id="root" aria-live="polite"></main>
<footer class="foot">AudioCal Hear v1.8.0 · Procesamiento local y sin envío de datos · Estimaciones perceptivas, no audiometría médica ni medición calibrada del equipo. Nunca uses volumen alto para escuchar un tono que no aparece.</footer>
</div>

omparten ecualización, no se corrigen por separado.":"I livelli dBFS non misurano la pressione sonora nell'orecchio. Non alzare il volume per toni impercettibili e riduci l'EQ se senti distorsione o disagio. Un EQ condiviso non corregge ogni orecchio separatamente.","Guarda aquí calibraciones distintas para tus auriculares, automóvil y parlantes.":"Salva qui regolazioni diverse per cuffie, auto e altoparlanti.","Se guardan en este navegador. Exporta una copia antes de borrar datos o cambiar de teléfono.":"Salvati in questo browser. Esporta una copia prima di cancellare dati o cambiare telefono.","Las frecuencias coinciden exactamente con tus fotos. El rango ±6 dB es provisional: ajústalo si tu radio admite otros límites.":"Le frequenze corrispondono alle foto. Il limite ±6 dB è provvisorio: cambialo se l'autoradio usa altri limiti.","Frecuencias exactas de la primera imagen; escala visible de −20 a +20 dB.":"Frequenze della prima immagine; scala visibile da −20 a +20 dB.","Frecuencias preferidas ISO/ANSI para intervalos de una octava.":"Frequenze preferite ISO/ANSI a intervalli di ottava.","Distribución frecuente de siete bandas; no todos los aparatos de 7 bandas son iguales.":"Schema comune a sette bande; i dispositivi possono variare.","Configuración común de cinco bandas. Comprueba las etiquetas de tu equipo.":"EQ comune a cinque bande. Controlla le etichette del dispositivo.","15 bandas en tercios aproximados de octava alternos.":"15 bande con centri alternati circa a terzi d'ottava.","31 bandas profesionales en tercios de octava. El examen completo es más largo.":"31 bande professionali a terzi d'ottava. Il test richiede più tempo.","Escribe las frecuencias que aparecen en tu ecualizador.":"Inserisci le frequenze indicate sull'EQ.","Graves y cuerpo":"Bassi e corpo","Bajos, batería y profundidad":"Bassi, batteria e profondità","Voces y claridad":"Voci e chiarezza","Voces e instrumentos en primer plano":"Voci e strumenti in primo piano","Detalle y brillo":"Dettag function timeRange(p,done=0){

 const pending=trials.filter(x=>!recorded(p,x));

 const exampleLow=pending.reduce((n,x)=>n+(x.pass===1?6:20),0);
 const exampleHigh=pending.reduce((n,x)=>n+(x.pass===1?12:38),0);

}

if(btn.dataset.adjust&&current){const f=Number(btn.dataset.adjust),r=recommend(current).find(x=>x.f===f);if(!r)return;const delta=Number(btn.dataset.delta),next=clamp(roundTo(r.gain+delta,current.step),current.min,current.max);current.manual[f]=(Number(current.manual[f])||0)+(next-r.gain);touch();refreshResultsUI();return}
if(btn.dataset.balancePreview&&current){
 if(!playerAudio||!playerUrl||playerAudio.paused){balanceStatus='Primero selecciona una canción y pulsa reproducir.';refreshBalanceUI();return}
 if(!filters.some(f=>Math.abs(f.frequency.value-balanceFreq)<.01)){balanceStatus='Esta frecuencia no está disponible en la salida de audio actual.';refreshBalanceUI();return}
 preferencePreview=null;balancePreview=btn.dataset.balancePreview;balanceListened.add(balancePreview);balanceStatus='Escucha varios segundos antes de cambiar entre A y B.';refreshBalanceUI();return;
}
if(btn.dataset.balanceChoose&&current){balanceChoose(btn.dataset.balanceChoose);return}
if(btn.dataset.prefPreview&&current){
 if(!playerAudio||!playerUrl||playerAudio.paused){const status=$('#prefStatus');if(status)status.textContent='Primero selecciona una canción en el reproductor inferior y pulsa reproducir.';localize(document.body);return}
 balancePreview=null;preferencePreview=btn.dataset.prefPreview;preferenceListened.add(preferencePreview);refreshResultsUI();return;
}
if(btn.dataset.prefChoose&&current){
 if(preferenceStage>=preferenceRounds.length)return;
 if(!playerUrl){const status=$('#prefStatus');if(status)status.textContent='Primero elige un archivo de música y escucha A/B.';localize(document.body);return}
 const choice=btn.dataset.prefChoose;const zone=preferenceRounds[preferenceStage].zone;
 if(preferenceListened.size<2){const status=$('#prefStatus');if(status)status.textContent='Escucha A y B mientras se reproduce la misma canción antes de elegir.';localize(document.body);return}
 const taste=cleanTaste(current);taste[zone]=clamp(taste[zone]+(choice==='A'?-2:choice==='B'?2:0),-3,3);current.taste=taste;
 preferenceStage++;preferencePreview=null;preferenceListened=new Set();touch();refreshResultsUI();return;
}
if(btn.dataset.load){let p=profiles.find(p=>p.id===btn.dataset.load);if(p){introStep=3;trial=null;setActive(p)}return}
if(btn.dataset.export){let p=profiles.find(p=>p.id===btn.dataset.export);if(p)exportDownload('AudioCal_'+cleanName(p.name)+'.json',JSON.stringify({app:'AudioCal Hear',version:1,profiles:[p]},null,2),'application/json');return}
if(btn.dataset.delete){const p=profiles.find(p=>p.id===btn.dataset.delete);if(p&&uiConfirm('¿Borrar el perfil «'+p.name+'»?')){profiles=profiles.filter(x=>x.id!==p.id);if(current?.id===p.id){current=profiles[0]||null;currentId=current?.id||''}save();render()}return}
const a=btn.dataset.act;if(!a)return;
switch(a){
case 'setup':case 'test':case 'results':case 'profiles':nav(a);break;
case 'create':createProfile();break;
case 'check':await playTone(true);break;
case 'stopaudio':stopTone();if(trial)trial.awaiting=false;floorReached=false;if(playerAudio)playerAudio.pause();render();break;
case 'resume':nav(firstMissing(current)<0?'results':'test');break;
case 'play':await playTone(false);break;
case 'answerYes':answerTone(true);break;
case 'answerNo':answerTone(false);break;
case 'introBack':introStep=Math.max(0,introStep-1);render();break;
case 'introNext':introStep=Math.min(3,introStep+1);render();break;
case 'ambient':await checkAmbient();break;
case 'endheard':if(current&&floorReached){logMeasure('stillheard')}break;
case 'enduncertain':if(current&&floorReached)logMeasure('timeout');break;
case 'next':awaitNext=false;floorReached=false;trial=null;sampleNote='';render();break;
case 'retry':awaitNext=false;floorReached=false;trial=null;sampleNote='';stopTone();render();break;
case 'resettest':if(current&&uiConfirm('Se borrarán las mediciones de este perfil, pero no los demás perfiles.')){current.measures={};current.manual={};awaitNext=false;floorReached=false;trial=null;introStep=3;sampleNote='';touch();render()}break;
case 'copy':{let ok=await copyText(resultText(current));$('#copyStatus').textContent=ok?'Valores copiados al portapapeles.':'No se pudo copiar. Usa Descargar TXT.';break}
case 'downloadtxt':exportDownload('AudioCal_'+cleanName(current.name)+'.txt',resultText(current),'text/plain;charset=utf-8');break;
case 'clearmanual':if(current){current.manual={};touch();refreshResultsUI()}break;
case 'balance-next':if(current){balanceQueueIndex=(balanceQueueIndex+1)%balanceQueue.length;balanceFreq=balanceQueue[balanceQueueIndex];resetBalanceRound();refreshBalanceUI()}break;
case 'balance-repeat':if(current){resetBalanceRound();refreshBalanceUI()}break;
case 'restartprefs':preferenceStage=0;preferencePreview=null;preferenceListened=new Set();refreshResultsUI();break;
case 'retrymissing':if(current){const points=gather(current).filter(x=>x.db===null).map(x=>x.f);const sides=current.channels==='separate'?['left','right']:['both'];for(const f of points)for(const side of sides)delete current.measures[key(f,side)];if(points.length){touch();awaitNext=false;trialElapsed=0;nav('test')}else uiAlert('No quedan frecuencias sin umbral.')}break;
case 'format':changeEqFormat();break;
case 'bypass':eqBypass=!eqBypass;balancePreview=null;updatePlayerFilters(preferencePreview?previewTaste():null);btn.textContent=eqBypass?'EQ DESACTIVADO · activar':'EQ ACTIVADO · comparar sin EQ';break;
case 'exportall':exportDownload('AudioCal_Hear_perfiles.json',JSON.stringify({app:'AudioCal Hear',version:1,profiles},null,2),'application/json');break;
case 'import':$('#importInput')?.click();break;
}}
function handleChange(e){const t=e.target;if(t.id==='uiLanguage'){if(LOCALES.includes(t.value)){language=t.value;try{localStorage.setItem(LANGUAGE_KEY,language)}catch(e){}localize(document.body)}return}if(t.id==='balanceFrequency'&&current){balanceFreq=Number(t.value);resetBalanceRound();refreshBalanceUI();return}if(t.id==='extraPreset'&&t.value){temp.name=$('#deviceName')?.value||temp.name;setPreset(t.value);return}if(t.id==='resultProfileSelect'){const p=profiles.find(x=>x.id===t.value);if(p){selectedEqFreq=null;setActive(p);nav('results')}return}if(t.id==='eqSlider')return;if(t.id==='deviceName')temp.name=t.value;if(t.id==='eqMin')temp.min=Number(t.value);if(t.id==='eqMax')temp.max=Number(t.value);if(t.id==='customFreqs'){const f=parseBands(t.value);if(f){temp.bands=f;$('#freqSummary').textContent=f.map(short).join(' · ')}}if(t.id==='musicFile')handleResultsEvents(t);
if(t.id==='importInput'&&t.files?.length){const file=t.files[0];file.text().then(s=>{let data;try{data=JSON.parse(s)}catch(e){uiAlert('Archivo JSON no válido.');return}if(!Array.isArray(data.profiles)){uiAlert('Formato de perfiles no reconocido.');return}let imported=0;for(const p of data.profiles){if(!p||!Array.isArray(p.bands)||p.bands.length<2||p.bands.length>31||p.bands.some(f=>!Number.isFinite(f)||f<20||f>20000)||!p.measures||typeof p.measures!=='object')continue;const copy={...p,id:'p'+Date.now()+Math.random().toString(36).slice(2,8),name:String(p.name||'Importado').slice(0,70),bands:p.bands.slice(),min:clamp(Number(p.min)||-12,-30,-1),max:clamp(Number(p.max)||12,1,30),step:1,passes:p.passes===2?2:1,testMode:p.testMode==='quick'?'quick':'complete',testStart:clamp(Number(p.testStart??TEST_START_DB),-84,-24),testFloor:clamp(Number(p.testFloor??TEST_END_DB),-84,-36),channels:p.channels==='separate'?'separate':'both',manual:p.manual&&typeof p.manual==='object'?p.manual:{},balance:p.balance&&typeof p.balance==='object'?Object.fromEntries(Object.entries(p.balance).filter(([f,v])=>p.bands.includes(Number(f))&&Number.isFinite(Number(v))).map(([f,v])=>[f,clamp(Math.round(Number(v)),-6,3)])):{},balanceProof:{}};profiles.push(copy);imported++}save();uiAlert('Se importaron '+imported+' perfil(es).');render()}).catch(()=>uiAlert('No se pudo leer el archivo.'))}}
// Ensure user can change tabs without generating sound; pause on backgrounding.
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{const t=e.target;if(t.id==='eqSlider'&&current){const x=recommend(current).find(q=>q.f===selectedEqFreq);if(x){const desired=clamp(roundTo(Number(t.value),current.step),current.min,current.max);current.manual[x.f]=(Number(current.manual[x.f])||0)+(desired-x.gain);touch();refreshResultsUI()}return}if(t.id==='deviceName')temp.name=t.value;if(t.id==='eqMin'&&Number.isFinite(Number(t.value)))temp.min=Number(t.value);if(t.id==='eqMax'&&Number.isFinite(Number(t.value)))temp.max=Number(t.value);if(t.id==='customFreqs'){const f=parseBands(t.value);if(f){temp.bands=f;if($('#freqSummary'))$('#freqSummary').textContent=f.map(short).join(' · ')}}if(t.id==='testStart'){const n=Number(t.value);if(Number.isFinite(n))temp.testStart=clamp(n,-84,-24)}if(t.id==='testFloor'){const n=Number(t.value);if(Number.isFinite(n))temp.testFloor=clamp(n,-84,-36)}if(['customFreqs','eqMin','eqMax','testStart','testFloor'].includes(t.id))refreshSetupDuration();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTone();floorReached=false;if(playerAudio)playerAudio.pause();if(page==='test')render()}});window.addEventListener('pagehide',stopTone);
if(current)resetBalanceSession(current);
render();
})();
