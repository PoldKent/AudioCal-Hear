  .topbar .logo { width:37px;height:37px;flex:0 0 37px; }
  .topbar .brand strong { font-size:clamp(14px,3.7vw,17px);white-space:nowrap; }

/* AudioCal Hear v1.9.1 — white, minimalist, accessible design approved by the project owner. */
:root{
  color-scheme:light;
  --bg:#ffffff;--panel:#ffffff;--panel2:#f7f9fc;
  --line:#e7ebf1;--fg:#172033;--muted:#68768a;
  --cyan:#2768e8;--yellow:#2768e8;--green:#147c64;--red:#bc3953;
  --radius:20px;
}
html{background:#fff}
body{background:#fff;color:var(--fg);font-size:15px;line-height:1.52;-webkit-font-smoothing:antialiased}
p{color:#536276}
a{color:#245ec9}
a:hover{text-decoration-thickness:2px}
h1,h2,h3{color:#172033}
label{color:#354255}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8bb5ff;outline-offset:3px}
::selection{background:#dce9ff;color:#193a7b}
.shell{padding-inline:clamp(12px,3.6vw,24px)}
.topbar{border-bottom:1px solid #f0f2f6}
.logo{background:#edf3ff;color:#2163d9;box-shadow:none;border:1px solid #dce8ff}
.brand strong{font-weight:800;color:#172033}
.brand small{color:#7b8797}
.pill{background:#f2f9f6;border-color:#d6e9dd;color:#207756}
.eyebrow{color:#245fc9;letter-spacing:1.6px}
.hero h1{font-weight:830;letter-spacing:-1.3px;color:#101827}
.hero h1 em{color:#2768e8}
.subtle,.muted{color:#68768a}
.card{background:#fff;border:1px solid #e8ecf1;box-shadow:0 5px 22px rgba(18,37,65,.035)}
.soft{background:#f8fafc;border:1px solid #e8edf3;color:#2c3b4e}
.warning,.soft.warning,.card.warning{background:#fff9eb;border-color:#f0d8a4;color:#875610}
.warning p,.warning strong{color:#875610}
.info,.soft.info,.card.info{background:#f2f7ff;border-color:#d5e3ff;color:#244579}
.field{background:#fff;color:#172033;border:1px solid #d6dee9;box-shadow:none}
.field::placeholder{color:#99a4b3}
.field:focus{outline:0;border-color:#2768e8;box-shadow:0 0 0 3px #e2edff}
.choice{background:#fff;border:1px solid #dfe5ed;color:#354154;transition:background .16s,border-color .16s}
.choice.selected{border-color:#2768e8;background:#eef4ff;color:#194aa6;box-shadow:inset 0 0 0 1px #2768e833}
.choice:hover:not(:disabled),.device-tile:hover:not(:disabled),.preset-tile:hover:not(:disabled){border-color:#92b6fb}
.btn{font-weight:750;letter-spacing:-.1px}
.btn-primary{background:#2768e8;border-color:#2768e8;color:#fff;box-shadow:0 3px 10px rgba(39,104,232,.12)}
.btn-primary:hover:not(:disabled){background:#1757cf}
.btn-alt{background:#edf4ff;border-color:#d5e4ff;color:#245fc9}
.btn-ghost{background:#fff;border-color:#dce3ed;color:#344256}
.btn-danger{background:#fff3f4;border-color:#f1ccd2;color:#a72f48}
.nav{background:rgba(255,255,255,.97);border-top:1px solid #e8ecf2;box-shadow:0 -5px 24px rgba(34,52,83,.045)}
.navbtn{color:#758195}
.navbtn.active{background:#edf4ff;color:#245fc9}
.navbtn:hover:not(.active){background:#f7f9fc;color:#344b6c}
.frequency{color:#18263b;font-weight:800}
.frequency small{color:#4b73c4}
.wavebox{background:#f7faff;border-color:#e1eaf8}
.wave span{background:linear-gradient(180deg,#94bdff,#3276e8)}
.meter,.hold-meter,.progress{background:#e8edf5}
.meter div{background:linear-gradient(90deg,#4b8df4,#2768e8)}
.hold-meter div{background:#2768e8}
.hold-time{color:#245fc9}
.progress div{background:#2768e8}
.stat{background:#f8fafc;border-color:#e5ebf2}
.stat strong{color:#245fc9}
.stat small{color:#65758a}
.equalizer{scrollbar-color:#cdd7e4 transparent}
.eqval,.value{color:#245fc9}
.eqbar{background:#f0f4fa;border-color:#d8e2ef}
.eqcenter{background:#9cadc266}
.eqfill{background:linear-gradient(0deg,#286fe0,#86b7ff)}
.eqlabel{color:#69798e}
.eqbuttons button,.itemcontrols button{background:#fff;border:1px solid #dce4ef;color:#2559ad}
.result-item{background:#fff;border-color:#e4eaf1}
.profile{background:#fff;border-color:#e4eaf1}
.profile.current{border-color:#2768e8}
.tag{background:#edf4ff;color:#245fc9}
.foot{color:#8994a4}
.divider{background:#edf0f4}
.status{color:#15765e}
select option{background:#fff;color:#172033}
.device-tile{background:#fff;border-color:#e0e6ee;color:#243146;box-shadow:0 2px 8px #192b4710}
.device-tile.selected,.preset-tile.selected{background:#eef5ff;border:2px solid #2768e8;color:#194aa6;box-shadow:0 0 0 2px #2768e816}
.preset-tile{background:#fff;border-color:#e0e6ee;color:#2d3a4d}
.preset-tile small{color:#708095}
.setup-summary{background:#f5f8fe;border-color:#dae5f7}
.setup-summary strong{color:#244b87}
.setup-summary .summary-time{color:#245fc9}
.unobtrusive{background:#fff;border-color:#e1e7ee}
.unobtrusive>summary{color:#304057}
.unobtrusive>summary::after{color:#2768e8}
.inline-hero{background:#fff;border-color:#e9edf3}
.profile-focus{background:#f5f8ff;border-color:#dae5f7}
.profile-focus .profile-icon,.profile-row .profile-icon{background:#e7efff}
.profile-row{background:#fff;border-color:#e2e8ef}
.profile-row-actions button{background:#fff;border-color:#dce3ed;color:#315a9a}
.profile-progress{background:#e7edf5}
.profile-progress>i{background:#2768e8}
.profiles-empty{background:#fafbfe;border-color:#d3dde9}
.profile-count{color:#245fc9}
.eq-stage{background:#f8faff;border-color:#e2eaf6}
.eq-stage .eqband.selected{background:#e7f0ff;border-color:#7da8f6}
.eq-stage .eqband:focus-visible{outline:3px solid #8bb5ff}
.eq-editor{background:#fff;border-color:#dce5f1}
.eq-editor-head strong{color:#245fc9}
.eq-editor input[type=range]{accent-color:#2768e8}
.eq-editor .editor-commands button{background:#eef4ff;border-color:#cdddf6;color:#245fc9}
.eq-editor .editor-commands button:active{background:#dde9fb}
.result-feedback,.compact-note{color:#66768b}
.result-feedback strong{color:#2d496e}
.language-controls select{background:#fff;color:#2c3b50;border:1px solid #d8e0eb}
.transfer-guide label{color:#57677c}
.transfer-current{background:#f7faff;border-color:#dbe5f2;color:#172033}
.transfer-path strong{background:#edf4ff;color:#2768e8}
.transfer-instruction{color:#245fc9}
.transfer-line{border-color:#e5ebf3}
@media (max-width:640px){
  .topbar{border-bottom:0}
  .card{border-radius:20px;padding:16px}
  .hero{padding-top:24px}
  .nav{background:#fffffff5;box-shadow:0 -3px 18px rgba(21,38,70,.04)}
}
@media (min-width:650px){
  .nav{border-color:#e4e9f1;box-shadow:0 9px 40px rgba(24,49,80,.08)}
}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}


/* Lote 1: evidence-first results; dBFS, interpretation and EQ are visibly separate. */
.trace-panel{margin:15px 0 18px;padding:14px;border:1px solid #dbe6f2;border-radius:18px;background:#f9fbff}
.trace-heading h2{margin:0 0 5px;font-size:18px}
.trace-part{background:#fff;border:1px solid #e7edf5;border-radius:14px;margin-top:11px;padding:13px}
.trace-part h3{font-size:15px;margin:0 0 7px}
.trace-part p{overflow-wrap:anywhere}
.trace-plot{max-width:100%;border-radius:12px;background:#fafdff;border:1px solid #e6edf6;padding:9px;overflow:hidden}
.trace-plot svg{height:auto;max-width:100%;display:block}
.trace-table-scroll{max-width:100%;overflow-x:auto;border:1px solid #e6ebf2;border-radius:10px;margin:9px 0}
.trace-table{width:100%;min-width:610px;border-collapse:collapse;font-size:12px;line-height:1.4;text-align:left}
.trace-table th,.trace-table td{padding:10px 9px;border-bottom:1px solid #e7ecf3;vertical-align:top;color:#29384c}
.trace-table thead th{color:#546478;background:#f5f8fd;white-space:nowrap;font-weight:760}
.trace-table tbody th{white-space:nowrap;color:#244f99;font-weight:750}
.trace-table tbody tr:last-child th,.trace-table tbody tr:last-child td{border-bottom:0}
.trace-table td:last-child strong{color:#205cc7;white-space:nowrap}
@media(max-width:430px){.trace-panel{padding:9px}.trace-part{padding:9px}.trace-heading h2{font-size:16px}}

/* Calibrated control-card preview: a local, offline canvas exported as PNG. */
.eq-card-config{display:grid;gap:7px;margin:13px 0;padding:12px;border-radius:12px;background:#f6f9ff}
.eq-card-config label{font-size:13px;font-weight:650;color:#39516f}
.eq-card-alert{padding:10px 12px;background:#eff7ff;border-radius:10px;color:#2d5c91;font-size:12px;margin:10px 0}
.eq-card-alert.eq-card-warning{background:#fff6ec;color:#80501f}
.eq-card-actions{margin-top:12px}

/* Optional suprathreshold experiment: clearly separate from automatic EQ. */
.loudness-panel{margin:14px 0}
.loudness-panel .inner-detail{display:grid;gap:11px}
.loudness-work{border:1px solid #e1e8f1;border-radius:13px;padding:12px;background:#f9fbff;display:grid;gap:11px}
.loudness-work p{margin:0}
.loudness-offset{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loudness-offset button{min-width:48px;min-height:43px;border:1px solid #c8d9ef;border-radius:10px;background:#fff;color:#245bc1;font-size:23px}
.loudness-offset strong{font-size:14px;text-align:center}
@media(max-width:430px){.loudness-offset strong{font-size:12px}}

.evidence-audit{margin:14px 0;padding:13px;border:1px solid #dce6f2;border-radius:16px;background:#fff}
.evidence-audit h2{font-size:18px;margin:0 0 7px}
.evidence-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.evidence-metrics>div{min-width:0;padding:10px 5px;text-align:center;border-radius:10px;background:#f5f8ff}
.evidence-metrics strong{font-size:21px;display:block;color:#2758a2}
.evidence-metrics span{font-size:11px;color:#66778b;display:block;overflow-wrap:break-word}
.evidence-audit .trace-table small{color:#708094}
@media(max-width:440px){.evidence-audit{padding:8px}.evidence-metrics strong{font-size:17px}}

/* Action-first recommendations: measured evidence remains available on demand. */
.starter-card{margin:4px 0 18px;padding:20px 22px}
.starter-card h2{font-size:23px;line-height:1.2;margin:6px 0 7px;color:#193654}
.starter-card>p{max-width:85ch}
.starter-bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin:16px 0}
.starter-band{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:89px;padding:9px 4px;background:#f7f9fc;border:1px solid #e2e9f3;border-radius:11px;gap:4px;text-align:center}
.starter-band strong{font-size:13px;color:#2d4363}
.starter-band span{font-weight:760;color:#284b72;font-size:19px;font-variant-numeric:tabular-nums}
.starter-band span.starter-adjust{color:#215db6}
.starter-band small{font-size:10px;color:#697992;line-height:1.3}
.starter-actions{margin:12px 0 0}
#technicalResults>.inner-detail{min-width:0}
#technicalResults .trace-panel,#technicalResults .eq-card-section{margin:12px 0}
.results-side .music-options,.results-side .balance-card{margin:0}
.results-side .music-options>.inner-detail,.results-side .balance-card>.inner-detail{min-width:0}
@media(max-width:520px){.starter-card{padding:15px}.starter-card h2{font-size:20px}.starter-bands{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.starter-band{padding:6px 2px;min-height:77px}.starter-band span{font-size:16px}.starter-band strong{font-size:11px}.starter-band small{font-size:9px}}

/* Unified results for v1.11: only one live EQ, PNG generated on demand. */
.eq-main-card{min-width:0}.starter-inline{margin:12px 0;padding:12px;background:#f6f9ff;border:1px solid #dce7f7;border-radius:13px}.starter-inline p{margin:5px 0 9px}.starter-inline strong{color:#214d99}
.eq-device-settings{margin-top:12px}.eq-device-settings>.inner-detail{padding-top:8px}.eq-card-config{padding:10px;margin:8px 0}.eq-card-config .field{min-width:0}
.optional-tool>summary,.eq-device-settings>summary{font-weight:750;color:#253e69}.optional-tool .inner-detail{min-width:0}.eq-card-actions>.btn{flex:1 1 180px}

/* Optional pre-test sweep: one compact step, no extra calibration wizard. */
.sweep-panel{margin:14px 0;padding:13px;background:#f7faff;border-color:#dce7f7;min-width:0}
.sweep-panel>strong{display:block;color:#204c8c;font-size:14px}
.sweep-panel .sweep-choices{margin:9px 0}
.sweep-panel .sweep-choices>.btn{font-size:12px;min-height:43px;padding:8px}
.sweep-mic-option{display:flex;align-items:center;gap:9px;font-weight:600;margin:12px 0;color:#304766}
.sweep-mic-option input{height:17px;width:17px;flex:0 0 auto}
.sweep-live{margin:12px 0;padding:12px;border:1px solid #d7e6fa;background:white;border-radius:13px}
.sweep-live #sweepCurrentHz{font-variant-numeric:tabular-nums;font-size:21px}
.sweep-live .grid2{margin:12px 0;gap:8px}
.sweep-live .grid2 button{min-height:52px}
.sweep-saved{border-top:1px solid #dbe5f4;margin-top:12px;padding-top:10px}
.sweep-saved p{margin:7px 0}
@media(max-width:420px){.sweep-panel{padding:10px}.sweep-live{padding:9px}.sweep-panel .sweep-choices .btn{padding:8px 4px;font-size:11px}}
</style>

rques un umbral, esa pasada quedará sin resultado. No subas el volumen.":"Se il tono finisce prima di segnare la soglia, la prova resta senza risultato. Non alzare il volume.","Carga una canción y alterna entre tu EQ y el sonido original. Solo cambia lo que reproduce esta página.":"Carica un brano e passa dall'EQ al suono originale. Cambia solo l'audio di questa pagina.","Con la canción reproduciéndose, escucha A y B durante varios segundos y elige qué suena mejor. Mantén el volumen fijo.":"Con il brano in riproduzione, ascolta A e B per qualche secondo e scegli il suono preferito. Mantieni fisso il volume.","Los niveles dBFS de la prueba no miden la presión sonora en el oído. Evita subir niveles para buscar tonos inaudibles y reduce los ajustes si aparece distorsión o molestia. Si ambos oídos comparten ecualización, no se corrigen por separado.":"I livelli dBFS non misurano la pressione sonora nell'orecchio. Non alzare il volume per toni impercettibili e riduci l'EQ se senti distorsione o disagio. Un EQ condiviso non corregge ogni orecchio separatamente.","Guarda aquí calibraciones distintas para tus auriculares, automóvil y parlantes.":"Salva qui regolazioni diverse per cuffie, auto e altoparlanti.","Se guardan en este navegador. Exporta una copia antes de borrar datos o cambiar de teléfono.":"Salvati in questo browser. Esporta una copia prima di cancellare dati o cambiare telefono.","Las frecuencias coinciden exactamente con tus fotos. El rango ±6 dB es provisional: ajústalo si tu radio admite otros límites.":"Le frequenze corrispondono alle foto. Il limite ±6 dB è provvisorio: cambialo se l'autoradio usa altri limiti.","Frecuencias exactas de la primera imagen; escala visible de −20 a +20 dB.":"Frequenze della prima immagine; scala visibile da −20 a +20 dB.","Frecuencias preferidas ISO/ANSI para intervalos de una octava.":"Frequenze preferite ISO/ANSI a intervalli di ottava.","Distribución frecuente de siete bandas; no todos los aparatos de 7 bandas son iguales. function plan(p){let bands=testBands(p).sort((a,b)=>Math.abs(Math.log2(a/1000))-Math.abs(Math.log2(b/1000)));let sides=p.channels==='separate'?['left','right']:['both'];return Array.from({length:p.passes},(_,pass)=>bands.flatMap(f=>sides.map(side=>({f,side,pass})))).flat();}

// Estimates are bounded by the new adaptive scheduler; no fixed threshold is promised.
function timeLabel(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m?`${m} min${r?' '+r+' s':''}`:`${r} s`}
function timeRange(p,done=0){
 const trials=plan(p),left=Math.max(0,trials.length-done);
 const completed=trials.filter(x=>recorded(p,x)).length;
 const remaining=Math.max(0,trials.length-completed);
 const pending=trials.filter(x=>!recorded(p,x));
 const max=pending.reduce((n,x)=>n+MAX_STEPS*SECONDS_PER_DB,0);
 const totalMax=trials.reduce((n,x)=>n+(x.pass===1?MAX_VERIFY:MAX_FIRST),0);
 const exampleLow=pending.reduce((n,x)=>n+12,0);
 const exampleHigh=pending.reduce((n,x)=>n+30,0);
 return {trials:trials.length,left:remaining,groupsPending:remaining,max,exampleLow,exampleHigh,maxTotal:totalMax};
}

  const elapsed=getElapsed();
  if(elapsed>=SECONDS_PER_DB){if(trial){trial.listenedSeconds=(trial.listenedSeconds||0)+SECONDS_PER_DB;trial.awaiting=true;}stopTone();render();return}
  const counter=$('#holdSeconds'),meter=$('#holdProgress');
  if(counter)counter.textContent=(SECONDS_PER_DB-elapsed).toFixed(1)+' s';
  if(meter)meter.style.width=clamp(elapsed/SECONDS_PER_DB*100,0,100)+'%';
  frame=requestAnimationFrame(update);

async function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Web Audio no está disponible. Usa Chrome o Safari actualizado.');audioCtx=new AC()}if(audioCtx.state!=='running')await audioCtx.resume();return audioCtx}

// Shared mapping for the export card and guided transfer; no invented dB/step.
// Round exact half-steps toward zero to avoid unintended extra boost/cut.
function physicalEqControl(gain,p,context=normalizeCalibrationContext(p.context,p.type)){
 const scale=context.eqScale;
 const ratio=scale==='db'?1:(scale==='steps'&&['1','2','3'].includes(context.eqStepDb)?Number(context.eqStepDb):null);
 if(!Number.isFinite(ratio))return {position:null,actualGain:null,delta:null,exact:false,ratio:null};
 const magnitude=Math.round(Math.abs(gain)/ratio-1e-9);
 const physicalMin=Number.isFinite(p.controlMin)?p.controlMin:p.min;
  const physicalMax=Number.isFinite(p.controlMax)?p.controlMax:p.max;
  const position=clamp(magnitude===0?0:Math.sign(gain)*magnitude,Math.ceil(physicalMin),Math.floor(physicalMax));
 const actualGain=Number((position*ratio).toFixed(2));
 const delta=Number((actualGain-gain).toFixed(2));
 return {position,actualGain,delta,exact:Math.abs(delta)<.001,ratio};
}
function eqResultModel(p){

  const quality=b.db===null?'Sin umbral':b.derived?'Interpolado':b.quality==='mixed'?'Oídos distintos':b.quality==='good'?'Repetido':'Estimación';
  return {f:b.f,gain:b.gain,quality,auto:b.base,...projection};
 });
 const verified=rows.every(r=>r.ratio!==null);
 return {name:p.name,complete,scale,ratio:rows[0]?.ratio??null,context:calibrationContextLabel(p),

  label:scale==='db'?'dB de control':scale==='steps'?'posición':'sin verificar',
  rows,verified,
  warning:(!complete?'Prueba incompleta: ajustes provisionales. ':'')+
   (!verified?'Equivalencia del control desconocida: no calcular posiciones.':
   'Conversión de acuerdo con escala y dB/paso declarados por usuario (Hear no lo verifica). ')+
   'Los dB efectivos pueden ser diferentes de la sugerencia tras el redondeo. '+'Límites digitales '+p.min+' a +'+p.max+' dB; recorrido físico '+(p.controlMin??p.min)+' a +'+(p.controlMax??p.max)+' '+(scale==='steps'?'posiciones':scale==='db'?'dB del control':'unidades desconocidas')+'.'};
}

/* Landscape EQ image: one column per frequency. The primary value always
   comes from the same physicalEqControl projection as the transfer wizard. */
function eqPngLayout(p,m=eqResultModel(p)){
 const count=m.rows.length;
 const width=Math.max(1080,count*98+138);
 const height=782,left=82,right=width-52;
 const plotTop=265,zeroY=370,plotBottom=475;
 const gap=(right-left)/Math.max(1,count);
 const output=m.rows.map(r=>m.verified?r.position:r.gain);
 const absoluteMax=Math.max(3,...output.map(v=>Math.abs(v||0)),...(m.verified?[Math.abs(p.controlMin??p.min??0),Math.abs(p.controlMax??p.max??0)]:[]));
 const extent=Math.ceil(absoluteMax);
 const marks=[-extent,-Math.round(extent/2),0,Math.round(extent/2),extent];
 const x=i=>left+(i+.5)*gap;
 const y=v=>zeroY-v/extent*88;
 const columns=m.rows.map((r,i)=>({x:x(i),y:y(output[i]||0),value:output[i]||0,frequency:r.f,
  gain:r.gain,position:r.position,actualGain:r.actualGain,delta:r.delta}));
 return {width,height,left,right,plotTop,plotBottom,zeroY,gap,extent,marks,columns,
  unit:m.verified?(m.scale==='steps'?'posiciones':'dB del control'):'dB sugeridos, SIN posiciones',
  physical:m.verified};
}
function paintEqResult(canvas,p){

 const c=canvas.getContext('2d');if(!c)return false;
 const round=(x,y,width,height,r)=>{c.beginPath();c.roundRect(x,y,width,height,r)};
 const signed=v=>(v>0?'+':'')+v;
 const centered=(txt,x,y,font,color,maxWidth=layout.gap-14)=>{
  c.font=font;c.fillStyle=color;c.textAlign='center';c.fillText(txt,x,y,Math.max(35,maxWidth));c.textAlign='left';
 };
 c.fillStyle='#ffffff';c.fillRect(0,0,w,h);
 c.fillStyle='#2565cc';round(38,30,w-76,9,4);c.fill();
 c.fillStyle='#192e4b';c.font='bold 35px system-ui,sans-serif';
 c.fillText('AudioCal Hear',45,88);
 c.fillStyle='#52677f';c.font='20px system-ui,sans-serif';
 c.fillText('MI ECUALIZADOR · '+m.device+' · '+rows.length+' BANDAS',45,126,w-90);
 c.fillStyle='#1c3658';c.font='bold 27px system-ui,sans-serif';
 c.fillText(String(m.name),45,171,w-90);
 c.fillStyle='#63768c';c.font='17px system-ui,sans-serif';
 c.fillText(String(m.context),45,205,w-90);
 c.fillStyle='#245bb0';c.font='bold 20px system-ui,sans-serif';
 c.fillText('RESULTADO FINAL · '+layout.unit.toUpperCase(),45,242,w-90);
 // A common zero line and visible horizontal frequency axis.
 const chartLeft=layout.left,chartRight=layout.right;
 const n=layout.columns.length;
 for(let i=0;i<n;i+=2){
  const x=layout.columns[i].x;
  c.fillStyle='#f7faff';
  round(x-layout.gap*.48,layout.plotTop,layout.gap*.96,248,8);c.fill();
 }
 for(const tick of layout.marks){

  }else{

   point.value<0?Math.min(layout.plotBottom-6,y+23):layout.zeroY-13,
   'bold '+(n>17?16:21)+'px system-ui,sans-serif','#203c60');
  centered(fmt(r.f),x,505,'bold '+(n>17?15:20)+'px system-ui,sans-serif','#263e5d');
 }
 // Control values and digital-processing suggestions remain distinct units.
 c.fillStyle='#315478';c.font='bold 17px system-ui,sans-serif';
 c.fillText('CONTROLES PARA APLICAR',45,536);
 for(const [i,r] of rows.entries()){
  const x=layout.columns[i].x,cardWidth=layout.gap*.91;
  c.fillStyle=i%2===0?'#f2f6fc':'#f8faff';

   'bold '+(n>17?23:30)+'px system-ui,sans-serif',
   r.position===null?'#a45b27':'#205ca9',cardWidth-8);
  centered(r.position===null?'NO VERIFICADO':m.scale==='steps'?'posición':'dB control',x,616,

  centered('EQ '+signed(r.gain)+' dB',x,645,

    (n>17?10:12)+'px system-ui,sans-serif','#9a6237',cardWidth-6);
  }
 }
 c.fillStyle=m.complete?'#245787':'#9a572c';c.font='bold 18px system-ui,sans-serif';
 c.fillText(m.complete?'TEST FINALIZADO':'TEST INCOMPLETO · AJUSTES PROVISIONALES',45,708,w-90);
 c.fillStyle=m.verified?'#5b718a':'#9a572c';c.font='16px system-ui,sans-serif';
 const warning=m.verified?
  'Equivalencia declarada por el usuario, NO verificada por Hear · Corrección experimental':
  'SIN CONVERSIÓN VALIDADA: barras en dB sugeridos, NO posiciones físicas';
 c.fillText(warning,45,737,w-90);
 c.fillStyle='#75859b';c.font='14px system-ui,sans-serif';
 c.fillText('Sin medición acústica calibrada. Los valores efectivos pueden diferir por redondeo o filtros del equipo.',45,765,w-90);

// Optional, user-triggered starting hypothesis. Never rewrite the measured data
// or represent digital detection thresholds as calibrated frequency response.
function starterEqProposal(p){
 const raw=gather(p);
 const rows=p.bands.map(f=>({f,gain:0,reason:'Sin contraste local utilizable'}));
 // Do not imply that a sub-2 dB digital hypothesis can be applied as a whole 2–3 dB hardware step.
 const tooCoarse=p.context?.eqScale==='steps'&&['2','3'].includes(p.context?.eqStepDb);
 if(tooCoarse)return {rows,changes:0,tooCoarse:true};
 const usable=f=>{
  const record=raw.find(x=>x.f===f);
  if(!record||!Number.isFinite(record.db)||record.derived||record.quality==='mixed'||record.quality==='unmeasurable')return false;
  const sides=p.channels==='separate'?['left','right']:['both'];
  const values=sides.map(side=>(p.measures?.[key(f,side)]||[]).filter(x=>x?.kind==='heard'&&Number.isFinite(x.db)).map(x=>x.db)).filter(x=>x.length);
  if(values.length!==sides.length)return false;
  if(values.length===2&&Math.abs(median(values[0])-median(values[1]))>8)return false;
  return true;
 };
 const suggestions=[];
 for(let i=1;i<raw.length-1;i++){
  const a=raw[i-1],b=raw[i],c=raw[i+1];
  if(b.f<100||b.f>10000||![a,b,c].every(x=>usable(x.f)))continue;
  if(b.f/a.f>3.5||c.f/b.f>3.5)continue;
  // Outlying end bands often reflect the transducer or room, not the listener.
  if(Math.abs(a.db-b.db)>24||Math.abs(c.db-b.db)>24)continue;
  const expected=a.db+(c.db-a.db)*Math.log(b.f/a.f)/Math.log(c.f/a.f);
  const contrast=b.db-expected;
  if(Math.abs(contrast)<4)continue;
  suggestions.push({i,contrast,gain:Math.sign(contrast),f:b.f});
 }
 suggestions.sort((a,b)=>Math.abs(b.contrast)-Math.abs(a.contrast));
 // At most three small changes, never an inferred high-frequency rescue boost.
 for(const x of suggestions.slice(0,3)){
  rows[x.i].gain=x.gain;
  rows[x.i].reason='Contraste digital local '+(x.contrast>0?'+':'')+x.contrast.toFixed(1)+' dBFS; prueba auditiva, no calibración acústica';
 }
 return {rows,changes:rows.filter(x=>x.gain!==0).length};
}

}

function refreshLoudnessUI(){

async function playLoudnessSample(which){
 if(!current||page!=='results')return;
 const f=loudnessSelectedBand(current);if(f===null)return;
 const profileId=current.id;
 const frequency=which==='reference'?1000:f;
 const db=LOUDNESS_REFERENCE_DBFS+(which==='target'?loudnessOffsetDb:0);
 if(db>LOUDNESS_REFERENCE_DBFS+LOUDNESS_OFFSET_LIMIT)return;
 try{
  stopTone();
  if(playerAudio)playerAudio.pause();
  const ctx=await ensureAudio();
  if(!current||current.id!==profileId||page!=='results'||loudnessSelectedBand(current)!==f)return;
  if(frequency>=ctx.sampleRate/2){loudnessMessage='Frecuencia fuera del rango reproducible en este equipo.';refreshLoudnessUI();return}
  const oscillator=ctx.createOscillator(),gain=ctx.createGain();
  oscillator.type='sine';oscillator.frequency.value=frequency;
  oscillator.connect(gain);gain.connect(ctx.destination);
  const t=ctx.currentTime+.03,amp=Math.pow(10,db/20);
  gain.gain.setValueAtTime(0.00000001,t);
  gain.gain.linearRampToValueAtTime(amp,t+.1);
  gain.gain.setValueAtTime(amp,t+.85);
  gain.gain.linearRampToValueAtTime(.00000001,t+.98);
  oscillator.start(t);oscillator.stop(t+1.03);
  oscillator.onended=()=>{try{oscillator.disconnect();gain.disconnect()}catch(e){}if(tone?.osc===oscillator)tone=null};
  tone={mode:'loudness',osc:oscillator,gain,start:t};
  loudnessListened.add(which);
  loudnessMessage='Señal '+(which==='reference'?'de referencia':'evaluada')+' reproducida a '+db+' dBFS digitales. Compara sin cambiar el volumen físico.';
  refreshLoudnessUI();
 }catch(e){loudnessMessage='No se pudo reproducir el tono: '+e.message;refreshLoudnessUI()}
}
function recordLoudnessSample(p){
 const f=loudnessSelectedBand(p);
 if(f===null)return false;
 if(!loudnessListened.has('reference')||!loudnessListened.has('target')){
  loudnessMessage='Escucha primero ambas señales de esta comparación.';return false;
 }
 if(!p.loudness||typeof p.loudness!=='object')p.loudness={};
 let records=Array.isArray(p.loudness[f])?p.loudness[f]:[];
 if(records.length>=2)records=[];
 records=[...records,{offsetDb:loudnessOffsetDb,referenceDbfs:LOUDNESS_REFERENCE_DBFS,
  method:'relative-tone-match-v1',at:Date.now()}];
 p.loudness[f]=records;
 loudnessMessage=records.length===1?'Primera comparación registrada. Repite con los mismos niveles físicos de escucha.':
  'Dos comparaciones registradas: '+loudnessEvidenceStatus(records)+'. Estos datos no modifican el EQ.';
 loudnessOffsetDb=0;loudnessListened=new Set();
 touch();return true;
}
function loudnessAction(action){
 if(!current)return;
 if(action==='stop'){stopTone();loudnessMessage='Tono detenido.';refreshLoudnessUI();return}
 if(action==='reference'||action==='target'){void playLoudnessSample(action);return}
 if(action==='plus'||action==='minus'){
  stopTone();loudnessOffsetDb=clamp(loudnessOffsetDb+(action==='plus'?1:-1),-LOUDNESS_OFFSET_LIMIT,LOUDNESS_OFFSET_LIMIT);
  loudnessListened.delete('target');
  loudnessMessage='Ajuste '+(loudnessOffsetDb>0?'+':'')+loudnessOffsetDb+' dBFS. Vuelve a escuchar la señal evaluada.';
 }else if(action==='record'){stopTone();recordLoudnessSample(current)}
 refreshLoudnessUI();
}

/* Audits repeatability only. No equal-loudness-to-EQ conversion. */
const EVIDENCE_AUDIT_VERSION='evidence-audit-v1';
function evidenceReport(p){
 const eligible=loudnessEligibleBands(p),auto=recommend(p);
 const half=pass=>{
  const measures=Object.create(null);
  for(const [k,a] of Object.entries(p.measures||{}))
   if(Array.isArray(a)&&a[pass])measures[k]=[a[pass]];
  return recommend({...p,measures,passes:1});
 };
 const split=p.passes===2?[half(0),half(1)]:null;
 const rows=p.bands.map((f,i)=>{
  const sides=p.channels==='separate'?['left','right']:['both'];
  const trials=sides.map(s=>{
   const a=p.measures?.[key(f,s)]||[];
   return [0,1].map(n=>a[n]?.kind==='heard'&&Number.isFinite(a[n].db)?a[n].db:null);
  });
  const first=trials.map(x=>x[0]).filter(Number.isFinite),second=trials.map(x=>x[1]).filter(Number.isFinite);
  const hasTwoValues=p.passes===2&&trials.every(x=>x.every(Number.isFinite));
  const paired=hasTwoValues&&sides.every(side=>independentThresholdPair(p,f,side));
  const historical=hasTwoValues&&!paired;
  const earsDiffer=first.length===2&&Math.abs(first[0]-first[1])>9;
  const repeated=paired&&!earsDiffer&&trials.every(x=>Math.abs(x[0]-x[1])<=6)&&
   (second.length<2||Math.abs(second[0]-second[1])<=9);
  const raw=Array.isArray(p.loudness?.[f])?p.loudness[f]:[];
  const offsets=raw.slice(0,2).filter(x=>Number.isInteger(x?.offsetDb)&&Math.abs(x.offsetDb)<=6).map(x=>x.offsetDb);
  const ceiling=offsets.some(x=>Math.abs(x)===6);
  const matchStable=offsets.length===2&&!ceiling&&Math.abs(offsets[0]-offsets[1])<=2;
  const thresholdStatus=historical?'Confirmación histórica; no son dos búsquedas independientes':
   earsDiffer?'Oídos distintos':repeated?'Repetible en búsquedas independientes':
   paired?'Revisar variación':first.length?'Sin segunda búsqueda independiente':'Sin umbral';
  const matchStatus=offsets.length<2?offsets.length?'Repetir':'Sin comparación':
   ceiling?'Límite del test':matchStable?'Repetible':'Inconsistente';
  const a=paired?split[0][i].base:null,b=paired?split[1][i].base:null;
  const autoStable=Boolean(repeated&&a!==null&&a*b>0);
  const autoStatus=a===null?(historical?'Confirmación histórica; no se valida estabilidad':'Sin dos búsquedas independientes'):!repeated?'No reproducible':
   a===0&&b===0?'Ambos neutros':autoStable?'Dirección repetida':'Cálculos distintos';
  return {f,threshold:{first:first.length?median(first):null,second:second.length?median(second):null,
    paired,repeated,historical,status:thresholdStatus},
   loudness:{offsets,eligible:eligible.includes(f),stable:matchStable,status:matchStatus},
   auto:{gain:auto[i].base,stable:autoStable,status:autoStatus}};
 });
 const count={threshold:rows.filter(x=>x.threshold.repeated).length,
  thresholdPairs:rows.filter(x=>x.threshold.paired).length,
  historical:rows.filter(x=>x.threshold.historical).length,
  matching:rows.filter(x=>x.loudness.stable).length,
  matchingPairs:rows.filter(x=>x.loudness.offsets.length===2).length,
  automatic:rows.filter(x=>x.auto.stable).length,
  active:rows.filter(x=>x.auto.gain!==0).length};
 return {version:EVIDENCE_AUDIT_VERSION,algorithm:EQ_ALGORITHM_VERSION,context:calibrationContextLabel(p),rows,count};
}
function evidenceAuditMarkup(p){
 const report=evidenceReport(p),n=report.count;
 const shown=v=>v===null?'—':v+' dBFS';
 const rows=report.rows.map(x=>{
  const t=x.threshold,l=x.loudness,a=x.auto;
  const offsets=l.offsets.length?l.offsets.map(v=>(v>0?'+':'')+v).join(' / ')+' dBFS':'—';
  return '<tr><th scope="row">'+fmt(x.f)+'</th><td>'+shown(t.first)+' / '+shown(t.second)+
   '<small style="display:block">'+esc(t.status)+'</small></td><td>'+offsets+
   '<small style="display:block">'+esc(l.status)+'</small></td><td>'+
   (a.gain>0?'+':'')+a.gain+' dB<small style="display:block">'+esc(a.status)+'</small></td></tr>';
 }).join('');
 return '<section id="evidenceAudit" class="evidence-audit">'+
 '<h2>Validar la estabilidad de los resultados</h2>'+
 '<p class="small muted">Comparación independiente. No modifica la medición ni la corrección automática.</p>'+
 '<div class="evidence-metrics"><div><strong>'+n.threshold+'/'+p.bands.length+'</strong><span>Umbrales repetibles</span></div>'+
 '<div><strong>'+n.matching+'/'+loudnessEligibleBands(p).length+'</strong><span>Sonoridad repetible</span></div>'+
 '<div><strong>'+n.automatic+'/'+n.active+'</strong><span>Dirección del EQ repetida</span></div></div>'+
 '<p class="compact-note">'+(p.passes===2?'Umbrales con dos pasadas: '+n.thresholdPairs+'.':
 'Para evaluar repetibilidad del test original, realiza dos búsquedas independientes.')+
 ' Registros históricos no independientes: '+n.historical+'. Comparaciones dobles de sonoridad: '+n.matchingPairs+'.</p>'+
 '<div class="trace-table-scroll"><table class="trace-table"><thead><tr><th>Frecuencia</th>'+
 '<th>Umbral pasada 1 / 2</th><th>Sonoridad comparación 1 / 2</th>'+
 '<th>EQ automático · estabilidad</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
 '<p class="tiny muted">Repetibilidad no demuestra precisión acústica ni preferencia musical. Los dBFS no son dB SPL ni ganancias del EQ. Los límites ±6 dBFS de la comparación se marcan como no concluyentes.</p>'+
 button('↓ Exportar evidencia CSV','download-audit','btn-alt full')+'</section>';
}
function evidenceCsv(p){
 const r=evidenceReport(p),q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const lines=[['AudioCal Hear','Evidencia experimental, no calibración acústica'],
  ['Algoritmo',r.algorithm],['Informe',r.version],['Perfil',p.name],['Contexto',r.context],['Aclaración histórica','Las confirmaciones antiguas no cuentan como búsquedas independientes'],
  ['Frecuencia Hz','Umbral pasada 1 dBFS','Umbral pasada 2 dBFS','Estado umbral',
   'Sonoridad comparación 1 dBFS relativo','Sonoridad comparación 2 dBFS relativo',
   'Estado sonoridad','EQ automático dB','Estado EQ']];

}

 if(Number.isFinite(level))await playTone(true,'both',level);
}break;
case 'confirmlevel':if(current&&introStep===0&&volumePreviewPlayed&&tone?.mode!=='preview'){
 const steps=volumePreviewSteps(current);volumePreviewPlayed=false;
 if(volumePreviewIndex+1>=steps.length)volumeReady=true;else volumePreviewIndex++;
 render();
}break;
case 'ambient':await checkAmbient();break;
case 'sweep-start':await startSweep();break;
case 'sweep-finish':finishSweep();break;
case 'endheard':if(current&&floorReached){logMeasure('stillheard')}break;
case 'enduncertain':if(current&&floorReached)logMeasure('unconfirmed');break;
case 'retryrecord':if(current&&lastRecordedEntry&&lastResultKind==='unconfirmed'){
  const k=key(lastRecordedEntry.f,lastRecordedEntry.side);
  if(lastRecordedEntry.pass===0){delete current.measures[k]}
  else if(Array.isArray(current.measures[k]))current.measures[k].length=1;
  awaitNext=false;floorReached=false;trial=null;sampleNote='';lastResultKind=null;lastRecordedEntry=null;stopTone();touch();render();
 }break;
 case 'next':awaitNext=false;floorReached=false;trial=null;sampleNote='';render();break;
case 'retry':awaitNext=false;floorReached=false;trial=null;sampleNote='';stopTone();render();break;
case 'resettest':if(current&&uiConfirm('Se borrarán las mediciones de este perfil, pero no los demás perfiles.')){current.measures={};current.loudness={};current.manual={};awaitNext=false;floorReached=false;trial=null;resetChannelCheck();resetVolumePreview();introStep=0;sampleNote='';touch();render()}break;
case 'transfer-open':transferOpen=true;transferStep=0;transferBandIndex=0;transferStatus='';refreshTransfer();break;
case 'transfer-close':transferOpen=false;refreshTransfer();break;
case 'transfer-next':if(!current)return;if(transferStep===1&&!transferMapping(current)){transferStatus='Revisa las frecuencias reales del ecualizador.';refreshTransfer();break}
 transferStep=Math.min(3,transferStep+1);transferBandIndex=0;transferStatus='';refreshTransfer();break;
case 'transfer-prev':transferStep=Math.max(0,transferStep-1);transferStatus='';refreshTransfer();break;
case 'transfer-backbands':transferStep=2;transferStatus='';refreshTransfer();break;
case 'transfer-nextband':if(current){const bands=transferMapping(current)||[];if(transferBandIndex+1<bands.length)transferBandIndex++;else transferStep=3;transferStatus='';refreshTransfer()}break;
case 'transfer-mark':if(current){const bands=transferMapping(current)||[];const f=bands[transferBandIndex]?.f;if(f!==undefined){if(transferCompleted.has(f))transferCompleted.delete(f);else transferCompleted.add(f);refreshTransfer()}}break;
case 'transfer-applyfreq':if(current){transferCustom=$('#transferCustom')?.value||transferCustom;transferStatus=transferMapping(current)?'Bandas registradas. Los valores aproximados se identificarán.':'Revisa las frecuencias: de 2 a 31 valores únicos en orden ascendente.';transferBandIndex=0;transferCompleted=new Set();refreshTransfer()}break;
case 'transfer-copy':if(current){const ok=await copyText(transferCopy(current));transferStatus=ok?'Lista copiada. Debes introducirla manualmente.':'No se pudo copiar la lista.';refreshTransfer()}break;
case 'starter-apply':if(current){
 const proposal=starterEqProposal(current),actual=recommend(current);
 if(proposal.changes){
  const hasPrevious=Object.values(current.manual||{}).some(x=>Number(x)!==0)||Object.values(current.balance||{}).some(x=>Number(x)!==0)||Object.values(current.taste||{}).some(x=>Number(x)!==0);
  if(hasPrevious&&!uiConfirm('Usar esta propuesta reemplazará los valores actuales del EQ. Las respuestas del examen se conservarán. ¿Continuar?'))break;
  for(const [i,item] of proposal.rows.entries()){
   const target=clamp(item.gain,current.min,current.max);
   current.manual[item.f]=(Number(current.manual[item.f])||0)+target-actual[i].gain;
  }
  transferCompleted.clear();lastRenderedEqSignature=null;
  if(transferOpen)transferStatus='Cambió el EQ; revisa los controles físicos antes de aplicarlos.';
  touch();render();
 }break;
}
case 'starter-copy':if(current){
 const ok=await copyText(starterEqCopy(current));
 const el=$('#starterStatus');if(el)el.textContent=ok?'Valores sugeridos copiados. Verifica los controles físicos antes de aplicarlos.':'No se pudo copiar; puedes consultar la tabla superior.';
 break;
}
case 'copy':{let ok=await copyText(resultText(current));$('#copyStatus').textContent=ok?'Valores copiados al portapapeles.':'No se pudo copiar. Usa Descargar TXT.';break}
case 'downloadpng':if(current&&!saveEqCardPng(current))uiAlert('No se pudo generar el PNG.');break;
case 'copycontrols':if(current){const ok=await copyText(eqControlText(current));const el=$('#eqCardNotice');if(el)el.textContent=ok?'Instrucciones copiadas al portapapeles.':'No se pudieron copiar los valores.'}break;
case 'download-audit':if(current)exportDownload('AudioCal_Auditoria_'+cleanName(current.name)+'.csv',evidenceCsv(current),'text/csv;charset=utf-8');break;
case 'downloadtxt':exportDownload('AudioCal_'+cleanName(current.name)+'.txt',resultText(current),'text/plain;charset=utf-8');break;
case 'clearmanual':if(current){current.manual={};touch();refreshResultsUI()}break;
case 'balance-next':if(current){balanceQueueIndex=(balanceQueueIndex+1)%balanceQueue.length;balanceFreq=balanceQueue[balanceQueueIndex];resetBalanceRound();refreshBalanceUI()}break;
case 'balance-repeat':if(current){resetBalanceRound();refreshBalanceUI()}break;
case 'restartprefs':preferenceStage=0;preferencePreview=null;preferenceListened=new Set();refreshResultsUI();break;
case 'retrymissing':if(current){
 const incomplete=plan(current).filter(e=>{
  const sample=current.measures?.[key(e.f,e.side)]?.[e.pass];
  return !sample||sample.kind!=='heard'||!Number.isFinite(sample.db);
 });
 // Preserve other confirmed frequency/side pairs; reset all passes only for a failing pair.
 const failedPairs=[...new Set(incomplete.map(e=>key(e.f,e.side)))];
 for(const pair of failedPairs)delete current.measures[pair];
 if(failedPairs.length){
  stopTone();trial=null;awaitNext=false;floorReached=false;introStep=current.channels==='separate'&&!channelsReady(current)?0:3;touch();nav('test');
 }else uiAlert('Todos los umbrales programados ya están confirmados.');
}break;
case 'format':changeEqFormat();break;
case 'bypass':eqBypass=!eqBypass;balancePreview=null;updatePlayerFilters(preferencePreview?previewTaste():null);btn.textContent=eqBypass?'EQ DESACTIVADO · activar':'EQ ACTIVADO · comparar sin EQ';break;
case 'exportall':exportDownload('AudioCal_Hear_perfiles.json',JSON.stringify({app:'AudioCal Hear',version:1,profiles},null,2),'application/json');break;
case 'import':$('#importInput')?.click();break;
}}
function handleChange(e){const t=e.target;
if(t.id==='sweepMicChoice'){sweepMicEnabled=!!t.checked;return}
if(t.id==='loudnessFrequency'&&current){stopTone();loudnessFreq=Number(t.value);loudnessOffsetDb=0;loudnessListened=new Set();loudnessMessage='Nueva frecuencia seleccionada. Compara las dos señales.';refreshLoudnessUI();return}
if(current&&(t.id==='resultControlMin'||t.id==='resultControlMax')){
  const value=Number(t.value),field=t.id==='resultControlMin'?'controlMin':'controlMax';
  if(!Number.isInteger(value)||(field==='controlMin'&&(value>=0||value<-30))||(field==='controlMax'&&(value<=0||value>30))){
   uiAlert('Introduce un límite físico válido para el control.');render();return;
  }
  current[field]=value;transferCompleted.clear();transferBandIndex=0;
  if(transferOpen)transferStatus='Cambió el rango físico. Revisa nuevamente las posiciones.';
  touch();render();return;
 }
 if(current&&(t.id==='resultEqScale'||t.id==='resultEqStepDb')){
 const f=t.id==='resultEqScale'?'eqScale':'eqStepDb';
 const next={...normalizeCalibrationContext(current.context,current.type),provenance:'captured',[f]:t.value};
 current.context=normalizeCalibrationContext(next,current.type);
 transferCompleted.clear();transferBandIndex=0;
 if(transferOpen)transferStatus='Cambió la escala del equipo. Revisa nuevamente las posiciones de los controles.';
 touch();render();return;
}
if(t.dataset.context&&temp.context){const f=t.dataset.context;const next={...temp.context,[f]:t.value};temp.context=normalizeCalibrationContext(next,temp.type);if(f==='subtype'||f==='eqScale'){temp.name=$('#deviceName')?.value||temp.name;render()}return}
if(current&&t.id==='transferFormat'){transferPreset=t.value;transferBandIndex=0;transferCompleted=new Set();transferStatus='';if(transferPreset==='custom'&&!transferCustom)transferCustom=current.bands.join(', ');refreshTransfer();return}
if(current&&t.id==='transferRange'){transferRange=t.value;transferBandIndex=0;transferCompleted=new Set();transferStatus='';refreshTransfer();return}
if(current&&t.id==='transferCustom'){transferCustom=t.value;return}
if(t.id==='uiLanguage'){if(LOCALES.includes(t.value)){language=t.value;try{localStorage.setItem(LANGUAGE_KEY,language)}catch(e){}localize(document.body)}return}if(t.id==='balanceFrequency'&&current){balanceFreq=Number(t.value);resetBalanceRound();refreshBalanceUI();return}if(t.id==='extraPreset'&&t.value){temp.name=$('#deviceName')?.value||temp.name;setPreset(t.value);return}if(t.id==='resultProfileSelect'){const p=profiles.find(x=>x.id===t.value);if(p){selectedEqFreq=null;setActive(p);nav('results')}return}if(t.id==='eqSlider')return;if(t.id==='deviceName')temp.name=t.value;if(t.id==='eqMin')temp.min=Number(t.value);if(t.id==='eqMax')temp.max=Number(t.value);if(t.id==='controlMin')temp.controlMin=Number(t.value);if(t.id==='controlMax')temp.controlMax=Number(t.value);if(t.id==='customFreqs'){const f=parseBands(t.value);if(f){temp.bands=f;$('#freqSummary').textContent=f.map(short).join(' · ')}}if(t.id==='musicFile')handleResultsEvents(t);
if(t.id==='importInput'&&t.files?.length){
 const file=t.files[0];
 if(file.size>2*1024*1024){uiAlert('El respaldo supera el límite de seguridad de 2 MB.');t.value='';return}
 file.text().then(s=>{
  let data;try{data=JSON.parse(s)}catch(e){uiAlert('Archivo JSON no válido.');return}
  if(!data||typeof data!=='object'||data.app!=='AudioCal Hear'||!Array.isArray(data.profiles)){uiAlert('Formato de perfiles no reconocido.');return}
  let imported=0;
  for(const raw of data.profiles.slice(0,100)){
   if(profiles.length>=200)break;
   const p=normalizedProfile(raw,true);
   if(!p)continue;
   profiles.push(p);imported++;
  }
  save();uiAlert('Se importaron '+imported+' perfil(es).');render();
 }).catch(()=>uiAlert('No se pudo leer el archivo.')).finally(()=>{t.value=''})
}
}
// Ensure user can change tabs without generating sound; pause on backgrounding.
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',e=>{const t=e.target;if(t.id==='eqSlider'&&current){const x=recommend(current).find(q=>q.f===selectedEqFreq);if(x){const desired=clamp(roundTo(Number(t.value),current.step),current.min,current.max);current.manual[x.f]=(Number(current.manual[x.f])||0)+(desired-x.gain);touch();refreshResultsUI()}return}if(t.id==='deviceName')temp.name=t.value;if(t.id==='eqMin'&&Number.isFinite(Number(t.value)))temp.min=Number(t.value);if(t.id==='eqMax'&&Number.isFinite(Number(t.value)))temp.max=Number(t.value);if(t.id==='controlMin'&&Number.isFinite(Number(t.value)))temp.controlMin=Number(t.value);if(t.id==='controlMax'&&Number.isFinite(Number(t.value)))temp.controlMax=Number(t.value);if(t.id==='customFreqs'){const f=parseBands(t.value);if(f){temp.bands=f;if($('#freqSummary'))$('#freqSummary').textContent=f.map(short).join(' · ')}}if(t.id==='testStart'){const n=Number(t.value);if(Number.isFinite(n))temp.testStart=clamp(n,-99,maxTestStart(temp))}if(t.id==='testFloor'){const n=Number(t.value);if(Number.isFinite(n))temp.testFloor=clamp(n,-100,-36)}if(['customFreqs','eqMin','eqMax','controlMin','controlMax','testStart','testFloor'].includes(t.id))refreshSetupDuration();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTone();floorReached=false;if(playerAudio)playerAudio.pause();if(page==='test')render()}});window.addEventListener('pagehide',()=>{stopTone();if(playerAudio)playerAudio.pause();try{playerSource?.disconnect()}catch(e){}try{playerPreamp?.disconnect()}catch(e){}try{playerOutput?.disconnect()}catch(e){}if(playerUrl)URL.revokeObjectURL(playerUrl)});
if(current)resetBalanceSession(current);
render();
})();
</script>
